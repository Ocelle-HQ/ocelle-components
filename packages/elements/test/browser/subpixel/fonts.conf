<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Subpixel (LCD) text for link-subpixel.test.ts (014 phase 6 operator round 3, O3-01; landing L1-01; research.md R-15
  "Amendment: text antialiasing under the ring samples"). CI's Chromium draws text with subpixel antialiasing; the local
  default draws grayscale. This file keeps the system configuration, so the same fonts are used, and changes only how
  glyphs are drawn: RGB subpixel order, the default LCD filter and slight hinting.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
