<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anchored popover strict-CSP fixture</title>
<link rel="stylesheet" href="tokens.css">
<script type="module" src="anchored-popover.js"></script>
</head>
<body>
<main id="interaction-fixture">
  <h1>Compact controls</h1>
  <div id="chrome">
    <button id="before" type="button">Before controls</button>
    <ocelle-anchored-popover id="appearance" label="Appearance menu">
      <span slot="trigger" aria-hidden="true">☼</span>
      <button id="first" type="button">Light theme</button>
      <button id="unavailable" type="button" disabled>Unavailable theme</button>
      <button id="last" type="button">Dark theme</button>
    </ocelle-anchored-popover>
    <button id="after" type="button">After controls</button>
    <ocelle-anchored-popover id="profile" label="Profile menu">
      <span slot="trigger" aria-hidden="true">AR</span>
      <button id="profile-action" type="button">Account details</button>
    </ocelle-anchored-popover>
  </div>
  <button id="outside" type="button">Outside action</button>
  <span id="appearance-probe" hidden></span>
  <span id="panel-probe" hidden></span>
</main>
<main id="placement-fixture">
  <div id="placement-top-clip" class="placement-clip">
    <ocelle-anchored-popover id="placement-top" label="Top edge options" placement="below">
      <span slot="trigger" aria-hidden="true">☼</span>
    </ocelle-anchored-popover>
  </div>
  <div id="placement-bottom-clip" class="placement-clip">
    <ocelle-anchored-popover id="placement-bottom" label="Bottom edge options" placement="above">
      <span slot="trigger" aria-hidden="true">AR</span>
    </ocelle-anchored-popover>
  </div>
</main>
<template id="placement-actions">
  <div class="placement-actions">
    <button data-first-action type="button"><span>Review the notification delivery schedule</span></button>
    <button type="button">Appearance</button>
    <button type="button">Activity history</button>
    <button type="button">Digest frequency</button>
    <button type="button">Account details</button>
    <button type="button">Device alerts</button>
    <button type="button">Shortcuts</button>
    <button type="button">Display density</button>
    <button type="button">Regional settings</button>
    <button type="button">Accessibility</button>
    <button type="button">Help and support</button>
    <button data-last-action type="button">Finish preference review</button>
  </div>
</template>
</body>
</html>
