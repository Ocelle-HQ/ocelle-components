schema_version: "1.0"

extension:
  id: story
  name: "Story Review Loop"
  version: "1.3.0"
  description: "Implement tasks.md one phase (user story) at a time, with an independent review and fix rounds after each phase"
  author: Ocelle-HQ
  repository: https://github.com/Ocelle-HQ/ocelle-components
  license: Apache-2.0

requires:
  speckit_version: ">=1.2.5"
  tools:
    - name: git
      required: true

provides:
  commands:
    - name: speckit.story.implement
      file: commands/speckit.story.implement.md
      description: "Implement the open tasks of one tasks.md phase (a user story) and commit them"
    - name: speckit.story.review
      file: commands/speckit.story.review.md
      description: "Review one implemented phase against its spec, plan, tasks and the constitution; write a verdict, change no code"
    - name: speckit.story.fix
      file: commands/speckit.story.fix.md
      description: "Fix every blocking finding of the latest review of one phase and record how each was resolved"
  scripts:
    - name: story-units
      file: scripts/units.sh
      description: "List the tasks.md phases that still need implementing or an approved review, as JSON"
      runtimes: [bash]
    - name: story-base
      file: scripts/base.sh
      description: "Record the commit a phase starts from, so its review covers exactly its changes"
      runtimes: [bash]
    - name: story-verdict
      file: scripts/verdict.sh
      description: "Report the verdict of the latest review round of a phase, as JSON"
      runtimes: [bash]
    - name: story-red
      file: scripts/red.sh
      description: "Record a tests-only red commit and prove its tests fail"
      runtimes: [bash]
    - name: story-scaffold
      file: scripts/scaffold.sh
      description: "Record a phase's scaffold commit (signatures, no behaviour, no tests) before its red commit"
      runtimes: [bash]
    - name: story-tdd-check
      file: scripts/tdd-check.sh
      description: "Independent red/green check of a phase in clean worktrees, run before every review"
      runtimes: [bash]
    - name: story-summary
      file: scripts/summary.sh
      description: "Write the feature's run summary into the OKF bundle of the Spec Kit flows"
      runtimes: [bash]
    - name: story-accept
      file: scripts/accept.sh
      description: "Record that the operator accepted a phase whose latest review is not approved"
      runtimes: [bash]

  config:
    - name: story-config.yml
      template: story-config.yml
      description: "Test command, setup command, test file pathspecs and mutation command for the red/green check"
      required: false

tags:
  - "review"
  - "workflow"
  - "quality"
