schema_version: "1.0"
workflow:
  id: "ocelle-sdd"
  name: "Ocelle SDD Cycle with Spec Check, Plan Squad and Story Reviews"
  version: "1.2.0"
  author: "Ocelle-HQ"
  description: "specify → spec check → plan → adversarial plan squad → tasks → analyze, with operator gates, then implementation by user story with review and fix rounds"

requires:
  speckit_version: ">=1.2.5"
  integrations:
    any: ["claude"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # Spec-only analysis (the full /speckit-analyze needs tasks.md), fix loop, then the spec gate.
  - id: spec-check
    type: workflow
    workflow: "ocelle-spec-check"
    input:
      integration: "{{ inputs.integration }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: squad
    type: workflow
    workflow: "ocelle-plan-squad"
    input:
      integration: "{{ inputs.integration }}"

  - id: review-plan
    type: gate
    message: "The plan went through {{ steps.squad.output.rounds }} squad rounds (reviews/plan/ in the feature directory). Review the plan, its Constitution Check and the squad results before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # /speckit-analyze's analysis, saved to analysis-report.md so the gate (and later readers) can see it.
  - id: analyze
    command: speckit.squad.analyze
    integration: "{{ inputs.integration }}"

  - id: analysis-status
    type: shell
    run: ".specify/extensions/squad/scripts/analysis-status.sh"
    output_format: json

  - id: review-tasks
    type: gate
    message: "Review tasks.md and {{ steps.analysis-status.output.data.file }} (report written: {{ steps.analysis-status.output.data.present }}): {{ steps.analysis-status.output.data.critical }} critical, {{ steps.analysis-status.output.data.high }} high, {{ steps.analysis-status.output.data.medium }} medium, {{ steps.analysis-status.output.data.low }} low, coverage {{ steps.analysis-status.output.data.coverage }}%. Resolve critical findings before approving. Each '## Phase N' becomes one implement-review-fix unit; user-story phases should be independently testable."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    type: workflow
    workflow: "ocelle-implement"
    input:
      integration: "{{ inputs.integration }}"
