schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: fresh
findings:
  - id: PLAN-FRESH-1-001
    severity: 3
    title: "An exact multiline payload needs a defined newline boundary"
    evidence:
      - artifact: "spec.md FR-002 and SC-001 require the exact submitted string and data-model.md promises native textarea newline semantics without specifying where normalization happens."
      - code: "packages/elements/src/form-control.ts:258-263,334-336,409-431 store and submit the raw string. packages/elements/test/browser/driver.ts:616-632 observes the decoded URL-encoded request body."
      - probe: "In pinned Chromium, assigning one CRLF two CR three LF four to a native textarea produced all LF in its value and FormData. A FACE setFormValue with that input preserved the raw separators in FormData. URL-encoded native submit decoded to all CRLF."
    claim: |
      Reusing the raw shared value path can leave the current value, painted native field and host FormData
      disagreeing for pasted or script-provided Windows or legacy multiline text. A browser-fixture assertion
      comparing an LF FormData expectation with the real URL-encoded request could also fail for correct code.
    remedies:
      - "Specify and test matching a native textarea on mixed CRLF, CR and LF for defaults, property writes and reset. Distinguish LF in the value and FormData from the browser's native URL-encoded serialization in fixture expectations."
  - id: PLAN-FRESH-1-002
    severity: 2
    title: "Imperative name assignment can omit the initial answer entirely"
    evidence:
      - artifact: "spec.md US1 scenario 1 and FR-002 require same-task submission for a named field, while contracts/element.md exposes the name property and attribute and research.md calls out only setFormValue for the early value."
      - code: "packages/elements/src/form-control.ts:43-50 reflects name through Lit. Pinned @lit/reactive-element 2.1.2 queues reflection in _$changeProperty and writes the attribute in update. packages/elements/src/form-control.ts:334-336 calls setFormValue with a string."
      - probe: "In pinned Chromium, a FACE with a synchronous setFormValue was present in FormData with a name attribute, and omitted when the equivalent property assignment deferred writing that attribute to a microtask. A native textarea reflects its name property immediately."
    claim: |
      A host that constructs the textarea and sets name and value as properties before connecting it can
      submit with an empty answer entry set even though FormControl synchronized the value. Testing only
      parser markup with a name attribute masks the behavior for imperative hosts.
    remedies:
      - "Make the early-submission contract explicit and cover a same-task submission from a script-created textarea whose name and value are set as properties. Reflect the new element's name before form participation without changing existing controls."
