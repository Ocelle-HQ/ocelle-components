schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: testability
findings:
  - id: PLAN-TESTABILITY-1-001
    severity: 3
    title: "The existing driver cannot prove same-task submission"
    evidence:
      - artifact: "spec.md:20,45 requires a real submission in the insertion task before first render. plan.md:16,18 and research.md:5 do not specify how the browser harness preserves that boundary."
      - code: "packages/elements/test/scenarios/driver.ts:216-234 exposes a batched reset but no batched submit. packages/elements/test/in-process.ts:675-678,699-710 and packages/elements/test/browser/driver.ts:531-560,616-632 implement batch and submit as separate operations, with an update wait at the end of the batch."
    claim: |
      Inserting with the normal driver and calling submit in the next step tests an already rendered element. It can pass a regression that delays form association until the first update. Reading FormData after a separate submit likewise does not prove what the submit handler observed in the insertion task.
    remedies:
      - "Specify a synchronous in-page operation that registers the submit recorder, inserts the field, asserts the inner textarea has yet to render, calls requestSubmit and captures the event payload before yielding. Run it in the mutation-visible browser project and on the strict-CSP fixture. Require the check to fail when form-value synchronization is deferred to the first update."
  - id: PLAN-TESTABILITY-1-002
    severity: 2
    title: "Native FormData and submitted wire values have different newline oracles"
    evidence:
      - artifact: "spec.md:20,45 requires an exact submitted string including line breaks; plan.md:18 proposes shared browser scenario bodies."
      - code: "packages/elements/test/in-process.ts:332-340 records FormData directly. packages/elements/test/browser/driver.ts:628-632 decodes the actual submitted wire body. A pinned Chromium probe on a native textarea containing First LF Second returned First LF Second in FormData, and First CRLF Second in the decoded application/x-www-form-urlencoded request."
    claim: |
      A shared scenario that directly compares both driver submissions to the same literal can fail against a correct native-equivalent component. A broad newline normalization in the assertion could also mask a component regression in the script-visible value.
    remedies:
      - "Define two oracles. Assert the literal LF-bearing value from actual submit-event/FormData capture in both projects, and assert native-equivalent CRLF encoding separately if the scenario checks the fixture server's wire body."
  - id: PLAN-TESTABILITY-1-003
    severity: 2
    title: "The scaffold must let focused user-path tests reach assertions"
    evidence:
      - artifact: "plan.md:15-16 specifies an inert registration scaffold and then a red suite that includes keyboard, focus, and accessibility interaction."
      - code: ".specify/extensions/story/scripts/scaffold.sh:2-5 requires assertions to fail for missing behavior rather than setup. packages/elements/test/browser/driver.ts:398-415 resolve or act on the target before a caller can inspect the result."
    claim: |
      With only an inert tag, direct shadow-target keyboard, focus or accessibility steps can abort with a missing locator before their assertions, obscuring which behaviors the new tests establish. Module loadability alone is insufficient for a strict assertion-only red gate.
    remedies:
      - "Plan an assertion-first red harness that reports missing control as an observable contract failure before driver operations, or scaffold the native shadow control as an interaction target while leaving association and event behavior unimplemented. Use the exact focused red log to demonstrate each relevant test reaches a behavior assertion."
