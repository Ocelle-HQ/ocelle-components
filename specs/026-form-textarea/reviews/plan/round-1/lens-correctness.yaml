schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: correctness
findings:
  - id: PLAN-CORRECTNESS-1-001
    severity: 3
    title: "The plan leaves synchronous constraint validation unspecified"
    evidence:
      - artifact: "plan.md § Design and Implementation steps 2–3 prescribe reusing FormControl and widening its native-control type. research.md § Form association and timing requests a native comparison for same-task validation and only explains anchoring validity after rendering."
      - code: "packages/elements/src/form-control.ts:43–50,258–264,334–342,472–475,529–534. The base reflects required and disabled reactively, places the form value in ElementInternals immediately, and synchronizes native validity after render. A pinned Chromium probe found that an empty native required textarea has valueMissing immediately, while a form-associated custom element with only the required attribute has valueMissing false. Adding the actual readonly attribute immediately bars both from validation."
    claim: |
      A type widening and the base render-time validity synchronization do not deliver the planned same-task validation. An empty required control can submit before the first render, and a property write or reset can leave stale valueMissing until the next render. This can either skip a required answer or block an immediately corrected answer. The gate needs a concrete synchronous design as well as the eventual native anchor.
    remedies:
      - "Specify how the textarea synchronously reflects form-relevant state and keeps FACE validity current before and between renders, then anchors it to the shadow control after render. Add real requestSubmit checks for an initially empty required field and a same-task correction or reset, plus readonly and disabled participation checks. Keep the behavior change local to the textarea."
  - id: PLAN-CORRECTNESS-1-002
    severity: 3
    title: "Raw carriage returns make displayed and submitted values disagree"
    evidence:
      - artifact: "spec.md FR-002 promises that submitted and displayed values stay in step and calls the initial submitted string exact; data-model.md requires native newline semantics but gives no canonical input rule."
      - code: "packages/elements/src/form-control.ts:258–264,334–336,408–431 stores and submits strings unchanged. In the pinned Chromium probe, assigning x CRLF y CR z LF to a native textarea produced x LF y LF z LF in FormData, while setFormValue with the same raw input kept CRLF and CR."
    claim: |
      Passing the base's raw value directly to the native control makes the textarea display and expose normalized text while FormData and the custom property can retain carriage returns. The same split can recur on default updates, reset, or restore. The current use of exact leaves unclear whether these promises refer to the raw source string or the native textarea's API string.
    remedies:
      - "Define exact submitted value using native textarea API newline normalization. Specify one canonicalization boundary for defaults, script writes, and form-state restore so the displayed, current and submitted values agree before and after render. Test LF, CRLF and lone CR against a native textarea, including initial submission and reset."
  - id: PLAN-CORRECTNESS-1-003
    severity: 2
    title: "The Storybook plan omits a supported disabled state"
    evidence:
      - artifact: "plan.md § Implementation and evidence step 5 and spec.md SC-003 count exactly three Storybook states. Spec.md FR-003 and FR-004 also require a distinct disabled state."
      - code: ".specify/memory/constitution.md § V requires a story and pinned light/dark visual baseline per state. storybook/stories/form-input.stories.ts:39–47 gives the existing form control separate required, disabled, read-only, and focused stories."
    claim: |
      The editable, invalid and read-only stories requested by #74 are necessary, and the three-story cap omits visual evidence for disabled styling. A functional disabled FormData assertion does not show whether viewers can distinguish this fourth state.
    remedies:
      - "Keep the three named stories, include a disabled Storybook case with pinned light and dark baselines, and express the success criterion as coverage of the specified states rather than a count of three."
