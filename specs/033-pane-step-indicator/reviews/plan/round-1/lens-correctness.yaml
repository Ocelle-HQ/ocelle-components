schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: correctness
findings:
  - id: PLAN-CORRECTNESS-1-001
    severity: 3
    title: "Run strict CSP against a host that can enforce it"
    evidence:
      - artifact: "plan.md § Implementation Phases and Structure lines 28–39 use the built Storybook recipe for the planned strict-CSP check."
      - code: "storybook/test/integration/elements-stories.test.ts:17–19 explains that the built Storybook iframe contains inline scripts and is served without a CSP header. packages/elements/test/browser/workflow-canvas.test.ts:441 verifies the built aggregate in a separate strict-CSP host."
    claim: |
      The only named recipe test surface cannot demonstrate the policy in FR-007 and Constitution IV. Loading the Storybook iframe under the production header would block Storybook itself, while serving it normally supplies no CSP evidence for the new element or the composition.
    remedies:
      - "Plan a separate same-origin strict-CSP host using the built package and external scripts and styles. Reuse the recipe inputs or host module so the test can activate a real action and see the new indicator state. Keep Storybook tests for the built recipe under the preview's normal policy."
  - id: PLAN-CORRECTNESS-1-002
    severity: 2
    title: "Include the existing public entry-point assertions in phase 1"
    evidence:
      - artifact: "plan.md § Structure lines 36–40 names the new source and browser test and README. It leaves the existing package inventory unassigned."
      - code: "packages/elements/test/node/readme.test.ts:1061–1064 checks an exact README entry table and package export array. Lines 1702–1707 pin the overview's count and require its released tags."
    claim: |
      Adding the new package entry and naming the element in the README will fail an unchanged exact-list or count assertion. Constitution VII and approved triage 033 also require the MINOR changelog note, which the phase currently leaves out.
    remedies:
      - "Record the MINOR addition and assign package.json, src/index.ts, custom-elements.json, README.md, CHANGELOG.md and test/node/readme.test.ts to phase 1. Update the exact entries and overview assertions and verify the built registration and individual entry in the same phase."
  - id: PLAN-CORRECTNESS-1-003
    severity: 2
    title: "Cover nonempty progress with no current step"
    evidence:
      - artifact: "spec.md § Edge Cases allows a host to supply no current step. plan.md § Technical Context and Phase 1 cover empty input or duplicate current steps, and line 32 assigns one story per action combination without pinning a progress state for any story."
      - code: ".specify/memory/constitution.md:79–80 requires a pinned story per state."
    claim: |
      Empty input cannot demonstrate that an ordered, populated list stays visible when no step is current. The currently named cases allow a fallback that highlights the first step even when the host supplies no current step, and allow all three pinned stories to capture a current marker only.
    remedies:
      - "Name the nonempty no-current case in the focused phase 1 assertions. Assign one of the planned recipe variants a static nonempty no-current snapshot, or pin a separate example if the host transition must start current in all three."
