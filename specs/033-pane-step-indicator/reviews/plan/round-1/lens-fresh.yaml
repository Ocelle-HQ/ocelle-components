complete: true
phase: plan
round: 1
lens: fresh
findings:
  - id: PLAN-FRESH-1-001
    severity: 2
    title: "Pane navigation has no focus outcome after activation"
    evidence:
      - artifact: "spec.md § User Story 2 scenario 6 opens the Confirm pane and changes the primary label; plan.md § Phase 2 asserts the changes but does not assert where focus goes after the action."
      - code: "Chromium reproduction: Tab focused Continue to Confirm, Enter replaced the Choose pane markup with a Confirm heading and renamed action, and document.activeElement became BODY. Existing pane guidance in specs/009-workflow-layouts/contracts/elements.md:107 explicitly handles focus when the focused pane is replaced or hidden."
    claim: |
      A recipe can pass the planned keyboard assertion while dropping focus on every navigation.
      The result teaches host authors a flow that strands the keyboard user even though the pane,
      indicator and button label all update correctly.
    remedies:
      - "Specify and prove focus after keyboard navigation. Keep the action focused when its node survives an in-place update, or focus the new pane heading with a programmatic tab stop when the host replaces the view. Assert that subsequent Tab continues through the available actions."
