schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: a11y-security
findings:
  - id: PLAN-A11Y-SECURITY-1-001
    severity: 3
    title: "Preserve ordered-list semantics when styling the custom markers"
    evidence:
      - artifact: "plan.md § Technical Context specifies custom decorative markers and an ordered list. The verification section names Chromium but does not require preserving the list role when native markers are suppressed."
      - code: "packages/elements/src/ocelle-event-timeline.ts:69 uses list-style: none for a comparable marker list. MDN documents that Safari omits an ordered list from the accessibility tree when list-style is none outside a nav element: https://developer.mozilla.org/en-US/docs/Web/CSS/list-style#accessibility"
    claim: |
      Suppressing native markers for the recipe outside a navigation landmark can remove the list grouping in Safari even though the same markup passes a Chromium accessibility check. The ordered grouping is part of the step indicator's accessible meaning under FR-001 and FR-004.
    remedies:
      - "Specify a native ol/li structure and an explicit list role if the CSS suppresses native markers. Verify the built indicator still exposes one list with three ordered list items in both full and compact layouts."
  - id: PLAN-A11Y-SECURITY-1-002
    severity: 2
    title: "Prove keyboard focus survives the host's pane transition"
    evidence:
      - artifact: "spec.md § User Story 2 scenario 6 opens the Confirm pane after keyboard activation. plan.md § Phase 2 lists focus order and the positive action but leaves the focus destination after that transition unspecified."
      - code: "storybook/stories/workflow-canvas.stories.ts:108-120 explicitly focuses the intended action in a workflow recipe. WCAG 2.2 SC 2.4.3 requires sequential focus to preserve meaning and operability: https://www.w3.org/WAI/WCAG22/Understanding/focus-order.html"
    claim: |
      A host that replaces the footer while changing panes can lose the focused button. Initial Tab order and the updated indicator and label can all pass while the next keypress starts navigation outside the current action group.
    remedies:
      - "Define the example's focus destination after host navigation, either the preserved primary control or the newly opened pane's heading, and assert the actual focus and next logical keyboard move after the activation."
