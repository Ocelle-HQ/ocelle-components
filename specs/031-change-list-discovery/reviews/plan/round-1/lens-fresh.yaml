findings:
  - id: PLAN-FRESH-1-001
    severity: 3
    title: "Digest presentation needs grouping that preserves the exact copy value"
    evidence:
      - artifact: "spec.md FR-002 and FR-004 require readable long digests and requests for exact values. plan.md Phase 1 assigns those values to copy fields without specifying their visible grouping."
      - code: ".specify/memory/constitution.md Principle II requires digests in groups of four. packages/elements/src/ocelle-copy-field.ts:177-189 and 222-235 show and emit the same string as supplied. packages/elements/README.md lines 2901–2908 describes visual grouping that preserves the original string."
    claim: |
      Writing a raw digest into a copy field would leave its visible text ungrouped. Writing spaces into the field's value for presentation would also add spaces to the emitted request. The plan currently allows groups or copy values to be checked alone even though both must hold together.
    remedies:
      - "Specify a grouped, single readable presentation for each digest and keep the copy field's value equal to the original digest. Use the existing ocelle-code-block digest presentation beside a distinctly named Copy control, with narrowly scoped fixture CSS to prevent a duplicate value display via the public value part. Verify grouping at narrow width and exact request bytes in the same runnable fixture."
