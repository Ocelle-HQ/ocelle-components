schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: a11y-security
findings:
  - id: PLAN-A11Y-SECURITY-1-001
    severity: 3
    title: "The built Storybook iframe cannot provide the claimed strict-CSP proof"
    evidence:
      - artifact: "plan.md § Constitution check says the built story runs under the existing story CSP, and § Phase 1 tests the actual built iframe"
      - code: "storybook/test/integration/elements-stories.test.ts:14-19,31-32,71-83 says the iframe contains inline harness scripts and the local server sets Content-Type alone. It identifies elements-browser fixtures as the runtime strict-CSP target."
    claim: |
      A green Storybook browser test cannot support the plan's runtime CSP claim. The harness runs without a CSP header, so a new inline style, inline handler or external request in the composition could go unnoticed without explicit assertions.
    remedies:
      - "Correct the constitution check to distinguish the existing strict-CSP element evidence from Storybook behavior. For each rendered composition, assert no inline scripts, handlers or style attributes and no off-origin requests. Keep any claimed runtime CSP proof in an existing strict-CSP fixture or its equivalent."

  - id: PLAN-A11Y-SECURITY-1-002
    severity: 3
    title: "Keyboard assertions need the actual Copy buttons' names and visible focus"
    evidence:
      - artifact: "spec.md FR-003 and FR-004 require distinguishable and reachable Copy controls at 320 CSS pixels in forced colors. plan.md § Phase 1 names Tab order, activation, digest and status assertions without specifying how to assert the inner button names or visible focus."
      - code: "packages/elements/README.md:1794-1795,1819-1822,1832-1836 defines copy-label, the separate host group name, native Tab order, and the forced-colors focus ring."
    claim: |
      Two visibly labeled digest groups can expose two identically named Copy buttons. A test that counts Tab stops and checks the emitted digest can pass in that state. It can also pass with a clipped focus indicator at 320 CSS pixels.
    remedies:
      - "Use the public copy-label for distinct accessible button names and label each host group separately. In both themes and forced colors, locate the real buttons by role and name, then verify keyboard focus remains visible and within the viewport on each control at 320 CSS pixels."

  - id: PLAN-A11Y-SECURITY-1-003
    severity: 3
    title: "Clipboard simulation must belong to the runnable Storybook host"
    evidence:
      - artifact: "spec.md FR-004 requires simulated copy handling. plan.md § Phase 1 injects a local clipboard test double before loading the story and leaves the actual Storybook host's copy destination implicit."
      - code: "packages/elements/README.md:1769-1772,1797-1817 explains that the element emits a delayed request and the host owns the result. WebKit browser clipboard activation for that delayed request is unmeasured."
    claim: |
      A test-only clipboard replacement can hide a shipped composition that attempts a real clipboard write and depends on permissions. An outcome written to a host status attribute also does not re-announce identical successive statuses when that attribute has not changed.
    remedies:
      - "Implement the simulation in the runnable host. Record the exact composed request in memory, set the originating copy field's status property, and describe the result as simulated. Observe the actual request and that field's polite live-region text after keyboard activation without replacing browser clipboard permissions."
