schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: correctness
findings:
  - id: PLAN-CORRECTNESS-1-001
    severity: 3
    title: "Digest display, exact copy and simulation need one host contract"
    evidence:
      - artifact: "plan.md lines 17 and 21 name exact digest payloads and a clipboard test double. Spec FR-004 requires simulated copy handling in the examples."
      - code: ".specify/memory/constitution.md Principle II requires four-character digest groups. packages/elements/src/ocelle-copy-field.ts:177-179 and :222-235 use the same value for display and the request. specs/014-selection-input/spec.md:1114 assigns grouping to the host."
    claim: |
      Sending the raw digest as the copy-field value would leave it visibly ungrouped. Formatting the value changes the exact emitted string. A clipboard stub installed by the test could also hide a real clipboard write in the runnable fixture despite the requirement that the example simulate the action. The plan leaves both distinctions unresolved.
    remedies:
      - "Define grouped display and exact request text using the existing host-formatted value contract. Have the fixture host recover and verify the canonical digest in its simulation and report an accessible result without using the real clipboard. Clarify both exact strings in the spec and test the group presentation, payload, canonical identity and status."
  - id: PLAN-CORRECTNESS-1-002
    severity: 3
    title: "The inventory task misses exact Storybook and Plant assertions"
    evidence:
      - artifact: "plan.md lines 15 and 19 assign current Visual and Axe selectors, two stories and four PNGs to integration."
      - code: "gates/test/integration/storybook-build.test.ts:55 expects exactly 392 stories. gates/test/integration/plant-repo.test.ts:225 expects exactly 784 PNGs. gates/plants/visual/fail-token-changed/plant.json lists measured cases, and gates/lib/plant-judge.ts:264-291 checks exact findings."
    claim: |
      The new stories and baselines bring the exact counts to 394 and 788 on this pin. If integration updates only the specified Visual and Axe assertions, the Storybook build integration and Plant repository integration fail. The global visual token Plant must also be rerun to establish whether either new light story adds an expected finding.
    remedies:
      - "Name the build-count test, Plant repository baseline-count test, affected visual Plant expectations, and the Visual and Axe inventory targets at the selected integration pin in the integration owner's write scope. Add only measured Plant findings and keep the existing positive and negative checks intact."
  - id: PLAN-CORRECTNESS-1-003
    severity: 2
    title: "Op 030 has no pinned activation point in the mission pilot"
    evidence:
      - artifact: "plan.md lines 19 and 27 say to use Op 030 once available and compare only matching receipts. The integration table names inventory selectors before specifying which workflow pin supplies them."
      - code: "On plan pin c3183cb5, tooling/speckit/bin/worktree-return-check.sh is absent and gates/test/integration/visual.test.ts still holds the unsplit Visual scenarios. gates/lib/mutation/ranges.ts:27-43 excludes story and test files."
    claim: |
      The two fixtures can be developed and verified with the current workflow. Completing them that way would not prove the new handoff or Visual scheduling for #75. The owner also needs to know which inventory files to update if the Visual split lands during the mission. A story-only product diff cannot produce a positive mutation grouping sample.
    remedies:
      - "Record the current workflow pin as control and the reviewed Op 030 SHA as candidate. Set the candidate checkpoint before worker-return verification and inventory integration, and compare the same fixture revision in both workflows with the corresponding exact file mappings. Use the source-bearing #94 replay for positive mutation grouping evidence."
