      - artifact: "spec US1-7 'Given delta selected and focused, When Enter or Space is pressed again, Then delta stays selected and no event is emitted'; FR-015 Enter is handled (defaultPrevented true); contracts/elements.md lists one event, `ocelle-listbox-change`"
      - artifact: "008 spec (origin/claude/016-overlays specs/008-overlays/spec.md:52): the Open project dialog holds the listbox 'and its actions'"
    claim: |
      The first consumer confirms a folder. With this interface a keyboard user who presses Enter on the already
      selected folder gets nothing (no event, and the key's default prevented), and a double-click gives at most one
      change event, so the dialog cannot open a folder on Enter or double-click without hand-rolled key listeners on
