      - "Raise to the operator an `ocelle-listbox-activate` event (`{ value }`, on Enter on the selected option and on double-click), a MINOR addition to the surface with its own scenarios."

  - id: PLAN-CORRECTNESS-1-019
    severity: 1
    title: "box-decoration-break for the link's focus ring is either unnecessary (outline) or an unrecorded engine-floor feature"
    evidence:
      - artifact: "research.md R-08 'The focus ring uses `box-decoration-break: clone` so each line fragment is outlined (FR-048)'"
      - code: "packages/elements/README.md § Engines: 'An element that uses a feature newer than the floor raises the floor in this section ... and records the feature in its own feature's research'"
    claim: |
      `box-decoration-break` affects backgrounds, borders, padding and box-shadow, not `outline`, which the engine
      already draws per line fragment, so if the ring is an outline the property does nothing. If the ring is a
      box-shadow, the unprefixed property is (to this lens's knowledge, not measured here) Chromium 130 and only
      prefixed in WebKit, newer than the Chromium 125 / WebKit 17.4 floor the plan states, and not recorded.
    remedies:
      - "Draw the link's ring as an outline with the focus tokens and drop `box-decoration-break` from R-08, or record the property and its engine versions in R-06's floor list and the README's Engines section."

