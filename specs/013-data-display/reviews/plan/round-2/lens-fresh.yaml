schema: review-findings/v1
complete: true
phase: plan
round: 2
lens: fresh
# Probes: headless Chrome 153.0.8010.12 via /opt/node-tools/node_modules/playwright-core, scripts in the session
# scratchpad (lotte/p1.cjs to p4.cjs). Round 1's refute.md, fixes-1/2 and verify-1/2 were read; nothing below repeats
# a settled finding. Most findings attack round 1's fixes (R-02 mechanism, probe fallback, bounded sweep,
# pre-upgrade rule).
findings:
  - id: PLAN-FRESH-2-001
    severity: 3
    title: "Neither R-02 candidate can meet the stacking rule: candidate 2 is the rejected first design, and candidate 1 reads a shared ancestor that is too wide"
    evidence:
      - artifact: "research.md § R-02 Mechanism, candidate 2 (line 126): 'the <dl> is laid out two-column with inline-size filling its containing block, the host's inline size is read'"
      - artifact: "research.md § R-02 Mechanism, candidate 1 (line 123): 'a ResizeObserver on the host and on the nearest ancestor whose inline size does not depend on its content (found by walking up ...)'; § To measure: hosts listed are only 'a showModal() dialog, a popover, a float and a default flex item'"
      - code: "probe lotte/p1.cjs: short sheet ('Owner' / 'Ada Lovelace', plain grid fit-content(50%) minmax(0,1fr)) in a showModal() dialog at 1280 px. With the <dl> at inline-size auto, 100%, stretch and -webkit-fill-available the host is 149 px every time. Candidate 2 therefore reads 149 < 384 and stacks, the same as the first design round 1 rejected (PLAN-CORRECTNESS-1-003); the plan's own spike check 'a short sheet in a dialog at 1280 px (two columns)' fails by construction"
      - code: "probe lotte/p1.cjs: 600 px flex row, a 400 px fixed sibling, the sheet as a default flex item with a long value: the sheet is 200 px wide (dd 140 px), and its nearest content-independent ancestor is the 600 px flex container. Candidate 1 reads 600 >= 384 and keeps two columns in a 200 px sheet. A sheet in a grid 'auto' track beside '1fr' (498 px of 600) has the same shape"
      - code: "No DOM or CSSOM API reports whether an element's inline size 'depends on its content'; candidate 1 needs a hand-written classifier over display, float, position, flex/grid item sizing, dialog/popover, width keywords and writing mode, chosen once at connect and stale when an ancestor's style changes (a dialog opened later, a parent switched to flex)"
    claim: |
      Round 1's fork (a) rests on a measure, "the inline space available to the sheet", that the plan defers to phase 1's
      spike. Measured now, candidate 2 is not new: filling the containing block inside a shrink-to-fit host resolves to
      the shrink-to-fit size, so it is the history-free but still content-sized first design, and a short sheet in a wide
      dialog stacks. Candidate 1 is undefined for any host the sheet shares with siblings (flex rows, grid auto tracks,
      table cells), where it reads the whole row and leaves a 200 px sheet in two columns. US1-2's narrow inspector is
      exactly such a column in many shells. It also needs a heuristic no platform API supports. The spike's host list
      omits shared rows, so the spike could pass on four single-child hosts and ship this. The likely outcome is that
      phase 1 stops for the operator mid-run, after the plan gate, on a question that can be measured and decided now.
    remedies:
      - "Put the mechanism to the operator at the plan gate, not in phase 1's spike, with these options: (a) keep 'available space', define it for hosts shared with siblings (the share the host's container gives the sheet after its siblings), add a flex row with a fixed sibling, a grid auto track and a table cell to R-02's spike hosts, and record candidate 2 as rejected (it equals the first design); (b) replace the measure with a squeeze rule that needs no ancestor walk: in a measurement pass the sheet is laid out in two columns at its own size, and it stacks when a value's column is narrower than both its max-content and a token floor (for example --ocelle-measure-cell). This is history-free because it is always read from the two-column trial, it keeps a short sheet in a dialog in two columns, and it stacks a squeezed flex item. FR-005's wording changes, which is the operator's call; (c) decide on the sheet's own size only, add a public layout override (layout=\"columns\" | \"stacked\") for consumers in shrink-to-fit hosts, and amend FR-005 and FR-009."

  - id: PLAN-FRESH-2-002
    severity: 3
    title: "The pre-upgrade rule shows hidden facts: author display: block beats the user-agent [hidden] rule"
    evidence:
      - artifact: "research.md § R-01 Before upgrade (line 77) and § R-07 (line 497): ':where(ocelle-facts:not(:defined) > ocelle-fact) { display: block; }'; contracts/elements.md line 117"
      - artifact: "spec.md FR-003: 'An ocelle-fact with hidden or aria-hidden=\"true\" is not a pair (no row, no term, no definition)'; Edge Cases 'A hidden fact'"
      - code: "packages/styles/src/base.css has no [hidden] rule (grep 'hidden' finds none), so the only display: none on [hidden] is the user-agent sheet, and author-origin declarations beat user-agent ones whatever their specificity"
      - code: "probe lotte/p2.cjs: <ocelle-facts> (undefined) with <ocelle-fact label=\"Secret\" hidden>tok_live_123</ocelle-fact> under the planned rule: computed display 'block', height 18 px, document.body.innerText 'Ada\\ntok_live_123'"
    claim: |
      Round 1's fix for PLAN-FRESH-1-009 un-hides content. Before upgrade (a deferred module, a slow network, a script
      error, the very states FR-012 is written for), every ocelle-fact the server rendered with `hidden` is shown and is
      in the accessibility tree, because the rule is in the author origin and the hiding comes from the UA sheet. The
      element's own `:host([hidden]) { display: none; }` does not exist yet. A consumer that hides a fact server-side
      until it applies (FR-003 lets them) gets it painted on every slow load. The planned styles test (an undefined
      sheet, then defined) uses no hidden fact, so it cannot catch this, and no plant covers it.
    remedies:
      - "Narrow the rule to ':where(ocelle-facts:not(:defined) > ocelle-fact:not([hidden]))' in R-01, R-07, data-model.md and contracts/elements.md, and add to the styles browser test (contracts/checks.md § @ocelle/styles tests) a hidden fact that must have display none and no box before upgrade, with the plant 'the :not([hidden]) removed'."

  - id: PLAN-FRESH-2-003
    severity: 2
    title: "No body sets a valid --ocelle-facts-stack-below, so with round 1's fallback a sheet that ignores the hook passes every test and the 'probe removed' plant survives"
    evidence:
      - artifact: "research.md § R-02 Probes (line 140): 'When the hook probe measures 0 or a non-finite value, the element uses the default probe's measure'"
      - artifact: "contracts/checks.md line 111: 'the hook: invalid (24 rem), a percentage and 0, each at 320 px, stacked'; line 143: 'stacking | US1-2, resize | plant: the probe removed'"
      - code: "research.md § R-02: the hook defaults in :host to 24rem and the default probe measures 24rem, so with the hook unset both probes give 384 px. Every stacking body (US1-2, US1-3 at 320 px, resize 600/300/600, 640 px) uses the default hook, and the three fallback bodies run at 320 px, where 384 px also stacks"
    claim: |
      The fallback added for PLAN-A11Y-SECURITY-1-004 makes the two probes redundant whenever the hook is unset, and
      every planned body leaves it unset or invalid. Removing the hook probe (or a Stryker mutant that always takes the
      default branch, for example the 'measures 0' condition replaced by true) gives the default 384 px everywhere, and
      every body still passes. Removing only the default probe also passes, since the hook probe gives 384 px. So the
      named plant 'the probe removed' is ambiguous and, for either probe alone, survives. The public hook the manifest
      declares (FR-054) and the README documents ('a consumer with a wider inspector can lower it') has no test that it
      changes anything. Under SC-006 the survivor is a finding at phase 1's mutation run.
    remedies:
      - "Add a body with a valid hook in each direction, where the default gives the other result: a 300 px sheet with the hook at 15rem in two columns, and a 600 px sheet with the hook at 40rem stacked. Split the plant into 'hook probe ignored (default always used)' and 'default probe removed', each failing a named body (the valid-hook bodies and the invalid-hook bodies respectively)."

  - id: PLAN-FRESH-2-004
    severity: 2
    title: "A threshold change at a fixed size is never seen: the ResizeObserver watches the host and an ancestor, not the probes"
    evidence:
      - artifact: "research.md § R-02 Mechanism (line 123): 'a ResizeObserver on the host and on the nearest ancestor'; data-model.md 'stacked: available < threshold, recomputed in the ResizeObserver callback'"
      - artifact: "contracts/elements.md: '--ocelle-facts-stack-below ... absolute length' (rem and em are absolute lengths in the README's sense and change with the root or element font size)"
    claim: |
      The threshold is read from the probes, but only a size change of the host or the chosen ancestor triggers a read.
      If a consumer changes the hook at run time (a class or attribute on an ancestor for a 'wide inspector' mode, a
      theme switch), or the user changes the browser's default font size so that 24rem becomes a different pixel
      length while a px-sized or %-sized container keeps its width, the sheet stays in the old layout until something
      else resizes it. This is the history-dependence round 1's fork (a) was chosen to remove: the same content in the
      same space now gives different layouts depending on whether a resize happened after the threshold changed.
    remedies:
      - "Observe the hook probe and the default probe with the same ResizeObserver (their inline sizes are the threshold), state this in R-02 and data-model.md, and add a body that changes the hook on the host at a fixed 450 px width (15rem to 40rem) and asserts the layout flips without any resize."

  - id: PLAN-FRESH-2-005
    severity: 2
    title: "The bounded sweep restarts on every new node, so a polled or re-rendered loading panel moves for as long as it loads"
    evidence:
      - artifact: "research.md § R-06 (line 427): 'The motion restarts only when the bar becomes indeterminate again'; data-model.md line 130: 'A transition from determinate to indeterminate restarts the sweep'"
      - artifact: ".specify/memory/constitution.md line 8: elements work in 'a server-rendered Thymeleaf and htmx page, a Svelte shell ...'; spec.md Consumers: the console's server-rendered pages"
      - code: "CSS Animations 1: an animation starts when an element gets a computed animation-name, which happens for every newly inserted element and for every element leaving display: none. An htmx poll (hx-trigger=\"every 2s\", default innerHTML or outerHTML swap) that re-sends the loading panel inserts a new ocelle-progress each time; a Svelte {#if} block, a tab panel or a <details> that hides and shows the panel does the same"
    claim: |
      PLAN-A11Y-SECURITY-1-001 (a) bounds the motion per animation, but WCAG 2.2.2 is about what the user sees: moving
      content that lasts more than 5 s beside other content. The commonest server-rendered loading pattern, polling a
      region until the work finishes, replaces the bar every few seconds, and each replacement starts a fresh 4.2 s
      sweep. Motion then continues for minutes, the case round 1 set out to stop. No body, README sentence or story
      covers it, and the plan states the restart as intended behaviour.
    remedies:
      - "Anchor the sweep to the page: the module records one page-wide start time (for example document.timeline.currentTime when the first indeterminate bar on the page connects) and each bar sets its CSS animation's startTime to it through the Web Animations API (not a style write, so CSP is unaffected). A bar inserted after the window has passed shows the still mark at once. Add a body that replaces the bar at 2 s and asserts no running animation after 5 s from the first insertion, with a plant that drops the shared start."
      - "Keep per-node restarts and narrow the contract: the README tells consumers to keep the node across polls (morph, or poll a value elsewhere) and states that a replaced bar restarts its sweep, and R-06 records why this still meets 2.2.2 for the uses the README allows."

  - id: PLAN-FRESH-2-006
    severity: 2
    title: "The kitty-mission-ui variant inventory is never collected, and the mapping that proves SC-001 comes after all three elements are built"
    evidence:
      - artifact: "spec.md SC-001: 'for every .sk-facts, .sk-empty-state and .sk-progress variant kitty-mission-ui uses (183 class uses in all), an element and variant that replaces it'; FR-058"
      - artifact: "plan.md line 269: phase 4 'not exempt: the README mapping (FR-058)'; plan.md Decision 5 asks the orchestrator to fetch spec-kitty-design #280, #498, #510 and #523, but not kitty-mission-ui's class families"
      - code: "grep -rn 'sk-progress|sk-empty-state|sk-facts' over the repository outside specs/013 finds only the triage record (counts, no variants) and 003's copy of #535. No list of the families' modifiers exists anywhere the plan can read"
    claim: |
      The public surface (density; variant=panel; size=compact, ground, show-label) is fixed in phases 1 to 3 without
      knowing which variants the 183 uses take. If .sk-progress has a tone (failed or done), a striped or a labelled
      inline form, or .sk-empty-state has a compact or error form, it surfaces in phase 4, after the elements are folded,
      and SC-001 then fails or forces a surface change in polish. This is the 'requirement that will not survive contact
      with a consumer' case. Constitution VI makes the consumer's need the driver, and no source for that need is cited.
    remedies:
      - "Add to plan Decision 5 a read-only request for the list of .sk-facts, .sk-empty-state and .sk-progress modifiers and states kitty-mission-ui uses (role names and counts only, no code, per constitution VI), recorded in research before the plan gate. Then either confirm that each maps to the planned surface or send the gaps to the operator. Move each element's FR-058 mapping rows and their readme-test statements into that element's phase (red first) instead of phase 4."

  - id: PLAN-FRESH-2-007
    severity: 1
    title: "Empty-state presence counts hidden or empty slotted elements, and slotchange misses text that changes in place"
    evidence:
      - artifact: "research.md § R-04 Present parts (line 248): 'A part is present while its slot has assigned nodes that are not whitespace-only text. This is tracked by a slotchange listener per slot'; data-model.md line 81"
      - artifact: "spec.md FR-023: 'An empty slot MUST take no space and add no gap'"
      - code: "DOM: slot.assignedNodes() includes elements with the hidden attribute or display: none and empty elements; slotchange fires only when the set of assigned nodes changes, not on an assigned element's attribute change or a slotted text node's data change"
    claim: |
      A server-rendered page that ships <div slot="actions" hidden> and reveals it later, or an empty <p></p> body from a
      template conditional, gets an 'actions' or 'text' part marked present. The previous part keeps its
      margin-block-end, so a gap shows below the last visible part, which FR-023 forbids. Toggling `hidden` later never
      recomputes the flags. The present-parts bodies only add and remove nodes, so they cannot see this.
    remedies:
      - "Either define present as 'has an assigned node that renders a box or non-whitespace text', recomputed on slotchange plus a MutationObserver on the slotted elements' hidden attribute and characterData, with a body that toggles hidden on a slotted action; or keep the current rule and state it in the README and FR-023's plan notes ('a hidden slotted element still counts as present; remove it instead'), with a body that pins that behaviour."

  - id: PLAN-FRESH-2-008
    severity: 1
    title: "The facts threshold is tied to the shell sidebar width, so a consumer who widens its sidebar moves every sheet's stacking point"
    evidence:
      - artifact: "research.md § R-02 Threshold (line 132) and data-model.md line 35: default 'calc(var(--ocelle-shell-sidebar-width) + var(--ocelle-space-10))'"
      - code: "packages/tokens/src/source.ts:177 'shell-sidebar-width' value 20rem, group 'shell'; line 154 'space-10' 4rem"
    claim: |
      The 24rem default has nothing to do with the sidebar. It borrows a shell token that a consumer (or 011's shell
      layouts) can legitimately override for its own sidebar. Doing so silently changes where every facts sheet
      stacks, in inspectors and dialogs that have no sidebar. A later token change to the sidebar would also be a
      behaviour change in facts that nobody reviews as one.
    remedies:
      - "Build the default from tokens that carry no other layout meaning, for example 'calc(var(--ocelle-space-10) * 6)' (24rem), and record the reason in R-02."

  - id: PLAN-FRESH-2-009
    severity: 1
    title: "The story test's positive read of a running sweep only works in the first 4.2 s after render"
    evidence:
      - artifact: "contracts/checks.md line 211: SC-005 check 'paired with a running animation on the indeterminate progress story without reduced motion'; research.md R-08 Story test"
      - artifact: "research.md § R-06: three 1400 ms iterations, fill-mode none, then no animation"
    claim: |
      The bounded sweep (round 1's fix) has made this pairing time-bound. The story test loads a built Storybook, renders
      each story in light and dark and checks CSP and requests. If the indeterminate story's animation read comes after
      font loading, a theme switch or the other checks and more than 4.2 s after the bar connected, it finds no
      animation and fails. The failure depends on machine speed, so it is a flaky red, or a green that someone 'fixes'
      by weakening the pairing.
    remedies:
      - "State in contracts/checks.md that the positive read restarts the sweep before reading (set the story's bar determinate, then indeterminate again, or re-insert it) and reads within the first iteration, and that the reduced-motion read is taken from the same restart."
