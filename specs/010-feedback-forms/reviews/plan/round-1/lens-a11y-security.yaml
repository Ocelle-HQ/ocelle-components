schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: a11y-security
# Checked: spec.md, plan.md, research.md, data-model.md, contracts/elements.md, contracts/testing.md, quickstart.md,
# constitution 1.3.1; packages/tokens/src/source.ts (focus, control-border, danger, ink-muted, target-min records);
# packages/elements/src/ocelle-icon.ts and icons.ts (chevron-down exists, decorative by default).
# Probes: Playwright 1.x + Chrome for Testing 153.0.8010.12 (/usr/bin/google-chrome), CDP Accessibility.getFullAXTree,
# script kept in the session scratchpad (probe/probe.mjs), not committed. Chromium source read:
# third_party/blink/renderer/modules/accessibility/ax_object_cache_impl.cc (main, via raw.githubusercontent.com).
# Not checked: axe-core (not installed in this session), any real screen reader (none available).
# No finding on: strict CSP (adopted stylesheets, no inline script; capture is test-only and installed over CDP, which
# CSP does not block), no I/O, no new dependency or asset, reduced motion (no motion), target size (block size
# >= --ocelle-target-min = 2.75rem), contrast records (R-04 ratios; marker, danger, ink-muted, focus records confirmed in
# source.ts), no ID reference across a shadow root in the designed structure.
findings:
  - id: PLAN-A11Y-SECURITY-1-001
    severity: 3
    title: "A one-frame aria-hidden withhold is coalesced by Chromium's 150/350 ms accessibility serialization, so real AT can miss the announcement while the capture passes"
    evidence:
      - artifact: "research.md § R-02 'the content wrapper gets aria-hidden=\"true\" for one animation frame, then loses it, so the region's text goes from empty to the current text once'; data-model.md § Announcement transitions 'Withhold one frame: ... remove it in the next animation frame'; research.md § R-06 'withhold for one frame'"
      - artifact: "research.md § R-01 'getFullAXTree while paused returns the tree for the current DOM (it brings layout and the accessibility cache up to date before answering)' - the capture forces a renderer-side tree read at every mutation"
      - code: "Chromium ax_object_cache_impl.cc AXObjectCacheImpl::GetDeferredEventsDelay(): kDelayForDeferredUpdatesBeforePageLoad = 350, kDelayForDeferredUpdatesAfterPageLoad = 150; the serialization pipeline ('Process the current tree changes unless not enough time has passed, or another serialization is already in flight') defers sending tree changes to the browser process until that delay since the last serialization has passed; only focus, actions and a fixed list of events (not text, children or aria-hidden changes) are immediate (IsImmediateProcessingRequired / IsImmediateProcessingRequiredForEvent)"
    claim: |
      Live-region events that screen readers act on are generated in the browser process from the serialized tree
      updates, not from the renderer's current tree. Chromium serializes non-urgent tree changes at most every 150 ms
      after load (350 ms before load completes, i.e. an htmx swap triggered on load). When the withheld frame falls
      inside a deferral window - a serialization happened in the last 150 ms (a click that moved focus, an htmx
      request indicator, another notice), or one is in flight - the empty state and the filled state reach the browser
      in the same update, so it sees a region that appears already holding text (insertion) or text that never
      changed (reveal, politeness change, error reveal): no announcement. This is likely exactly in the consumers'
      fast paths (Kitty Desktop's local responses, a button click followed by a quick swap). The planned capture
      pauses at each DOM mutation and forces a fresh renderer tree, so it records the one-frame empty state every
      time and the tests pass while users hear nothing. Constitution III needs the announcement to reach AT, not only
      the renderer's tree.
    remedies:
      - "Withhold for longer than Chromium's serialization delay (for example until a timer of at least 2 x 150 ms after load, 2 x 350 ms before load completes, citing ax_object_cache_impl.cc in research R-02/R-06), keep the content visible throughout as now, and record the chosen duration and its source in the README's 'announced' limits; add a test that the withhold lasts at least that long."
      - "Change the mechanism to a persistent, already-serialized live region (present and empty from connect) into which the text is placed after a delay longer than the serialization window, and justify against the R-02 'reads the text twice' alternative; record the residual risk in the README."
  - id: PLAN-A11Y-SECURITY-1-002
    severity: 3
    title: "Chromium ignores aria-hidden on an ancestor of the focused element, so withholding does nothing when focus is on a slotted link"
    evidence:
      - artifact: "research.md § R-02 'It withholds on: insertion after parsing (not a move), reveal (the host's hidden removed), and a politeness change while live'; spec US1 scenario 18 (slotted link focusable by Tab) and scenario 15 (role alert -> status announces the current text once)"
      - code: "probe (Chrome 153, CDP getFullAXTree): shadow '<div aria-live=polite><div id=content><slot>' with slotted '<a href=/r/7>View run 7</a> Run failed.'; focus the link, then set aria-hidden=\"true\" on #content: the tree is unchanged - link 'View run 7' focused=true and StaticText ' Run failed.' both stay non-ignored, so the region's text never becomes empty"
    claim: |
      The announcement of a politeness change (tone info -> danger, host role alert <-> status, announce plus a live
      role) depends on the region's text going empty for a frame. If the keyboard user's focus is on a link inside the
      notice (FR-011 keeps slotted content focusable), Chromium refuses the aria-hidden and the text never empties, so
      the change is not announced, against FR-008 and SC-002. Even when nothing is focused, aria-hidden over focusable
      slotted content is the pattern axe's aria-hidden-focus rule flags and leaves a Tab target hidden from AT during
      the withhold; R-02 itself names this cost for the ElementInternals alternative but not for the chosen design.
    remedies:
      - "Add the state 'focus inside the notice during a politeness change or reveal' to the data model and to US1 (scenario 12 and 15 variants with a focused slotted link), and choose a withholding mechanism that does not hide focusable content (for example an announcement in a separate region that does not contain the slotted nodes), recorded in research R-02."
  - id: PLAN-A11Y-SECURITY-1-003
    severity: 3
    title: "The inner live region is not atomic and text changes 'need no action', so AT announces only the changed fragment, and shrinking text not at all"
    evidence:
      - artifact: "research.md § R-02 'Text changes need no action: the browser updates the region's text in place, which is an announcement by the spec's measure'; data-model.md 'light-DOM text changes | live, not hidden | none'; R-02 shadow structure '<div class=\"region\" [aria-live]>' with no aria-atomic"
      - artifact: "spec US1 scenario 11 'the new text (heading and body ...) is announced once'; scenario 19 'View run 8' change expects 'Error Run failed. View run 8', and aria-hidden on the link expects 'Error Run failed.'"
      - code: "probe (Chrome 153): <div aria-live=polite> -> live=polite atomic=false; <div role=status> -> live=polite atomic=true"
    claim: |
      With aria-atomic false (the default for an aria-live div) a screen reader speaks only the changed node: the
      user hears "View run 8", not the notice's text, and a heading change is read without its body. A change that
      only removes content (aria-hidden set on the link, the body shortened) is a removal, which the default
      aria-relevant ("additions text") does not announce at all. The tree-snapshot measure counts both as
      announcements of the whole text, so the planned tests pass while AT behaviour differs from what scenarios 11 and
      19 promise. The host-role rows are atomic by implicit ARIA semantics, so behaviour also differs between rows.
    remedies:
      - "Set aria-atomic=\"true\" on the inner region (R-02 structure, data model) and withhold on every text change as on insertion, so every change is an addition of the whole text; add the aria-atomic requirement to the README's 'announced' section."
  - id: PLAN-A11Y-SECURITY-1-004
    severity: 2
    title: "The 'visually hidden' name span is exposed in the accessibility tree, so browse-mode users hear the label twice"
    evidence:
      - artifact: "research.md § R-05 Naming 'the inner control is named by aria-labelledby pointing at one visually hidden span in the same shadow root whose text is the computed name ... The visible <label part=\"label\" for=\"control\"> keeps click-to-focus'"
      - code: "probe (Chrome 153): shadow '<label for=c>Lane title</label><span id=nm class=vh>Search lanes</span><input id=c aria-labelledby=nm>' with clip-based visually-hidden CSS: the tree holds StaticText 'Lane title' and a non-ignored StaticText 'Search lanes' before the textbox; for the plain case (label=\"Title\") that is 'Title', 'Title', textbox 'Title'"
    claim: |
      A visually hidden (clipped) span stays in the accessibility tree, so a screen reader in browse mode reads the
      label text, then the hidden copy, then the field with its name: every labelled control is announced with its
      label twice. The span exists only to carry the name; it should not be reading content.
    remedies:
      - "Give the name span the hidden attribute (aria-labelledby still takes its text; it is then ignored in the tree), or use aria-label on the inner control as R-05's alternative says, and add an assertion that no StaticText of the computed name exists outside the label part."
  - id: PLAN-A11Y-SECURITY-1-005
    severity: 2
    title: "Host aria-label and aria-description stay on a non-ignored generic host node, a second named and described node beside the control"
    evidence:
      - artifact: "research.md § R-05 Host ARIA 'The host's own attribute is not rewritten (005 convention), so its node carries the same value as the inner control, never a differing one'; '... aria-description is added to the description as above'; plan.md decision 3"
      - code: "probe (Chrome 153): form-associated <x-field aria-label=\"Search lanes\" aria-description=\"Host desc\"> with delegatesFocus shadow: host node is a non-ignored 'generic name=\"Search lanes\" desc=\"Host desc\"' wrapping the textbox 'Search lanes'"
    claim: |
      The plan's argument covers states (aria-invalid etc. equal on both nodes) but not the name and description: the
      host becomes an exposed generic with a name, which ARIA prohibits on generic, and the description sits both on
      the host and in the inner control's aria-describedby, so AT that reads descriptions can read it twice. Spec FR-022
      requires host ARIA not to stay as a second state on the host's node; a duplicated name and description is the
      same failure. axe was not available to check whether aria-prohibited-attr flags it (it flags aria-label on
      role-less div/span).
    remedies:
      - "Record in R-05 how the host node is kept from carrying a second name and description (for example the element removes aria-label/aria-description from the host after copying them, as a documented exception to the 005 'no host rewrite' convention, with a README note for htmx re-swaps), and add a tree assertion that the host node has no name and no description."
      - "Keep the host attributes, state in the README and plan that the host node carries a duplicate name and description, and add a test that pins the observed tree so a Chromium change is noticed."
  - id: PLAN-A11Y-SECURITY-1-006
    severity: 2
    title: "Host aria-label replacing a visible label fails WCAG 2.5.3 Label in Name"
    evidence:
      - artifact: "spec FR-022 '1. a non-empty host aria-label: its text, alone, whatever else is set'; US2 scenario 13 'given aria-label=\"Search lanes\" together with label=\"Lane title\" and the external label, Then the field is named \"Search lanes\"'"
      - artifact: "research.md § R-05 Naming 'host aria-label, else the labels' text then label'"
    claim: |
      When a visible label ("Lane title", or an external "Title") is drawn, WCAG 2.2 SC 2.5.3 (level A) requires the
      accessible name to contain the visible label text. The spec and plan make a host aria-label replace it, so the
      named precedence produces a non-conforming control (speech-input users saying "click Lane title" fail), and the
      scenario tests it as correct. Constitution III makes WCAG 2.2 AA non-negotiable.
    remedies:
      - "Change FR-022 (and US2 scenario 13, R-05) so that with a visible label the name starts with the visible label text (for example visible labels then aria-label, or aria-label only when no visible label is drawn), and test it."
      - "Keep the precedence but make the README state that aria-label must contain the visible label text and add the combination to the unsupported list, with an operator decision recorded."
  - id: PLAN-A11Y-SECURITY-1-007
    severity: 1
    title: "An external label's text is copied into the name only on connect, attribute change and focusin, so the tree carries a stale name"
    evidence:
      - artifact: "research.md § R-05 'The name is recomputed on connect, on every observed attribute change and on focusin (an external label's text is read when the control is next focused; README)'"
    claim: |
      The name is a copy of the external label's text, not a reference to it. If the host changes the label text (an
      htmx swap of the label, a localisation update) the textbox keeps the old name until focused; browse-mode and
      list-of-form-fields users of screen readers do not focus the control first, so they get the stale name (WCAG
      4.1.2). A native <label for> never goes stale.
    remedies:
      - "Observe the external labels' subtrees (a MutationObserver on each element of internals.labels, refreshed on connect and on focusin) and recompute the name on their change; add a scenario that changes an external label's text and reads the name without focusing."
  - id: PLAN-A11Y-SECURITY-1-008
    severity: 1
    title: "The select's indicator is positioned over the native select without pointer-events: none"
    evidence:
      - artifact: "research.md § R-07 'The indicator is an ocelle-icon name=\"chevron-down\" in the shadow root ..., positioned at the inline end with logical properties; the native select gets appearance: none'"
    claim: |
      An absolutely positioned icon on top of the select's inline end intercepts clicks and taps on the most obvious
      target (the chevron), so the list does not open there; the effective pointer target of the select shrinks by
      the icon's box. The plan does not say the indicator lets pointer events through.
    remedies:
      - "State pointer-events: none on the indicator in R-07 and add a scenario that a click at the indicator's centre focuses the select (and opens it, where observable)."
  - id: PLAN-A11Y-SECURITY-1-009
    severity: 1
    title: "Where the error mark's width rule lives in forced colours is not planned"
    evidence:
      - artifact: "spec FR-001 'variant rules inside @media not (forced-colors: active)'; FR-028 non-colour mark = boundary width --ocelle-bar-width; US2 scenario 15 'the error mark [is] visible' in forced colours; research.md R-05/R-06 give no forced-colours rule for the error state"
    claim: |
      In forced colours the danger colour is replaced, so the error state is shown only by the 3 px boundary width.
      If that width rule is written as a variant rule inside the not-forced-colours block, as FR-001 tells variant
      rules to be, the mark disappears in forced colours. The plan names forced-colours rules for the notice (R-03)
      but not for the control's error state.
    remedies:
      - "Add to R-05 (or a new styles entry) that the error boundary width rule sits outside the not-forced-colours block, with the boundary colour ButtonBorder/CanvasText as FR-025 says, and that the error text keeps a non-colour cue in forced colours."
