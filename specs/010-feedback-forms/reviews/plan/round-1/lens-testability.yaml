schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: testability
# Probes: raw CDP (Node 22 WebSocket) against /usr/bin/google-chrome (Chrome for Testing 153.0.8010.12, headless),
# reproducing research R-01's recorder: a MutationObserver whose callback runs `debugger`, and on each
# Debugger.paused an Accessibility.getFullAXTree read of every non-ignored node with live polite/assertive and its
# StaticText. Scripts kept outside the repository (session scratchpad, lotte-testability/capture.mjs, subframe.html,
# nowithhold.html); not committed.
findings:
  - id: PLAN-TESTABILITY-1-001
    severity: 4
    title: "The paused-mutation capture records empty states that no rendering update ever exposes, so a withhold that never reaches the tree counts as an announcement"
    evidence:
      - artifact: "research.md § R-01 Rationale: 'a snapshot per mutation batch sees every state the tree can take, including the one-frame empty region'; and 'getFullAXTree while paused returns the tree for the current DOM (it brings layout and the accessibility cache up to date before answering)'"
      - artifact: "spec.md § What 'announced' means here: 'read as a sequence of snapshots taken after each accessibility-tree update'; R-02: 'the content wrapper gets aria-hidden=\"true\" for one animation frame, then loses it'"
      - code: "probe subframe.html: a polite region inserted with its content aria-hidden, the attribute removed two microtasks later inside the same task (no rendering opportunity in between). Captured snapshots: [{polite,\"\"}], [{polite,\"Saved\"}], [{polite,\"Saved\"}] - by contracts/testing.md's announcements() rule this is one announcement of \"Saved\", although no frame, layout or accessibility serialization ever saw the empty state."
      - code: "HTML event loop, 'update the rendering': animation frame callbacks run before style, layout and paint of that frame; Chromium serializes accessibility changes in the document lifecycle after them. An aria-hidden set in a task and removed in the next requestAnimationFrame callback is therefore gone before the first lifecycle that could expose the empty region, unless another lifecycle intervened."
    claim: |
      The capture forces an accessibility-tree update at every mutation microtask. That makes it report states the
      browser never serializes for assistive technology, which is a different measure from the spec's "snapshots taken
      after each accessibility-tree update". The probe shows the capture cannot tell a withhold that lasts a frame from
      one that lasts no frame: an implementation, or a mutant, that clears the withhold in a microtask, or in the same
      rAF that precedes the first lifecycle (which is exactly R-02's design), passes every announcement scenario. A real
      screen reader may get nothing. Every announcement test (US1 8 to 17 and 19, US2 10, 18, 20, 22, SC-002) would then
      prove the oracle and not the behaviour. That is the vacuous-test pattern Principle VIII forbids, on the
      feature's central behaviour. The spike's "one announcement each" result is what this capture shows for any
      withhold, so it does not show that the design works.
    remedies:
      - "Tie snapshots to rendering updates. Tag each snapshot with a frame number from a test-side rAF counter and a post-lifecycle marker (for example a ResizeObserver or a requestAnimationFrame+MessageChannel 'after paint' hook). Let announcements() count an empty-to-text change only when the empty state was current across at least one rendering update. Add a plant whose withhold is cleared in a microtask, and another cleared in the first rAF, both of which must count zero. Change R-02 so the withhold spans a full rendering update (for example cleared in the second rAF, or after a measured lifecycle), and re-measure in the T002 spike."
      - "Or take a fork to the operator: redefine the spec's 'snapshot after each accessibility-tree update' as 'after each DOM mutation batch, tree forced up to date', and record in the README that a withhold shorter than one rendering update is not detected by the tests. This is a weaker oracle, and the operator has to accept it explicitly."
  - id: PLAN-TESTABILITY-1-002
    severity: 3
    title: "A freshly inserted host-role notice gives the capture an empty first snapshot from Lit's first-render timing, so role=alert/status insertion passes without any withholding; the recorder also cannot be armed on an element that does not exist yet"
    evidence:
      - artifact: "contracts/testing.md § Live-region capture: 'liveCapture.start(id) installs the paused-mutation recorder on the element with id (its host, its shadow roots, its parent) and returns when it is armed'"
      - artifact: "contracts/testing.md § Plants: only 'an element that never withholds (US1 scenario 8 fails)'; spec US1-15 and SC-002 require insertion announcements in the role=alert and role=status rows"
      - code: "probe nowithhold.html: a custom element that never withholds (shadow root attached in connectedCallback, rendered one microtask later, as Lit's ReactiveElement does) inserted with role=alert and text 'Saved'. Snapshots: [{alert,assertive,\"\"}], [{alert,assertive,\"Saved\"}]. That is one assertive announcement by the counting rule, with no withholding. Only one pause happened, at the parent's childList, because a MutationObserver on the parent does not see the shadow root's mutations."
    claim: |
      For insertion scenarios (US1-8, 9, 15, 19; US2-20; the insertion row of SC-002) the element under test does not
      exist when start(id) is called, and the contract does not say how the recorder reaches the shadow roots it
      attaches later. In the host-role rows the host's own node is the region. Its first paused snapshot, taken before
      Lit's first update microtask, has an empty shadow root and so empty text, whatever the element does. The planned
      never-withhold plant runs only against scenario 8, which uses the inner region, so nothing shows that the alert
      and status insertion assertions can fail. Here the capture produces the announcement itself.
    remedies:
      - "Define insertion capture in contracts/testing.md: arm on a container id before the insertion, and observe each shadow root as it is attached (for example by patching attachShadow in the test page, or re-arming at each pause). Run the never-withhold plant against US1-15's alert and status insertion and reveal cases and against US2-20, and require each to go red. If the first-render empty state of a host region is not a real tree state, exclude it from counting, as in PLAN-TESTABILITY-1-001's frame rule."
  - id: PLAN-TESTABILITY-1-003
    severity: 3
    title: "'Nothing is announced on first load' is vacuous when the capture is armed after the page has loaded"
    evidence:
      - artifact: "contracts/testing.md § Live-region capture: start(id) is armed on an existing element; no mode arms the recorder before navigation or parsing"
      - artifact: "spec.md US1-10, US1-15 ('a server-rendered role=\"alert\" notice is not announced when the page is first parsed'), US1-17 (first loaded hidden), US2-18, US2-22, SC-002 'zero for ... first load'"
      - code: "packages/elements/test/browser/fixtures/upgrade.html: the browser build is a module script at the end of body, so the upgrade (and any withhold the element might wrongly start then) happens during load, before a test can call start(id) on the loaded page"
    claim: |
      A zero-announcement claim holds trivially when the recorder only starts after the event it is meant to watch.
      The plan lists the plant 'one that withholds on first load (scenario 10 fails)'. With the contract's start(id),
      that plant's one-frame withhold is over before the recorder is armed, so the plant passes. Either the plant
      exposes the problem when it is run, or the first-load assertions are vacuous. Nothing in the plan arms the
      capture from navigation start.
    remedies:
      - "Add a capture mode to contracts/testing.md that is installed before the document is parsed (CDP Page.addScriptToEvaluateOnNewDocument for a document-level recorder, with the Debugger domain enabled before navigation). Use it for every first-load assertion. Require the first-load plant to go red under that mode in the phase-2 red run."
  - id: PLAN-TESTABILITY-1-004
    severity: 3
    title: "First-load detection in src/live.ts cannot be reached in process, so Stryker cannot kill its mutants"
    evidence:
      - code: "packages/elements/test/in-process.ts:67-72: mount() sets document.body.innerHTML after the test file has imported (and so defined) the element. Every in-process element is therefore 'inserted into a document that has finished parsing', never first load, and document.readyState is never 'loading' in the test iframe."
      - artifact: "research.md § R-02 First load: 'the constructor records this.isConnected ... the first connectedCallback counts as first load when that was true or document.readyState is \"loading\"'"
      - artifact: "research.md § R-09: a direct-call workaround is planned for history restore only ('the in-process test calls formStateRestoreCallback(state, \"restore\") on the element directly ... so Stryker covers the restore logic')"
    claim: |
      Stryker mutates only the in-process 'elements' project (stryker.elements.config.json, vitest.mutation.elements.config.ts).
      The first-load branch is the code behind US1-10, US1-15, US1-17, US2-18 and the build-loaded-late edge case.
      In process its condition is constant, so mutants such as 'this.isConnected' -> false, '||' -> '&&', or
      '=== \"loading\"' -> '!==' are NoCoverage or survive. Either outcome is a blocking SC-007 finding found only at
      review, or it is recorded as 'equivalent' when it is not. The fixture suites run the branch but are not mutated.
    remedies:
      - "Plan an in-process path to first load, as R-09 does for restore. A driver method mounts markup into a fresh document before the definition is registered (for example mount, then a dynamic import of the element module in a file with its own registry, or a scoped document created with document.implementation and adopted). Isolate the readyState read behind a function the test can drive, and state which mutants stay unreachable and why, before phase 2."
  - id: PLAN-TESTABILITY-1-005
    severity: 3
    title: "submit() is defined only against the fixture server; in process a real submission navigates the Vitest iframe, and the implicit-submission code is mutated only there"
    evidence:
      - artifact: "contracts/testing.md § Forms: 'submit(formId) (submits through the form's own submitter and returns the request body the fixture server received, or null when no submission happened)'; only navigateAwayAndBack() is marked 'Fixture pages only'"
      - artifact: "research.md § R-05 Implicit submission: defaultButton.click() / form.requestSubmit() logic in src/form-control.ts; spec US2-2 ('the request a plain submit sends'), US2-5, US2-21, FR-030"
      - code: "vitest.config.ts 'elements' project: browser mode, the test page is an iframe of the runner with no fixture server; stryker.elements.config.json mutates only that project"
    claim: |
      The shared scenario bodies call submit() in both harnesses, but the contract gives it no in-process meaning.
      A real submission in the Vitest iframe unloads the test page. A harness that intercepts the submit event would
      measure something other than 'the request a plain submit sends', and the contract does not say which one is
      meant. The implicit-submission rule (default button, disabled default button, exactly one blocking field,
      counting ocelle-form-input) is killed by mutants only in process. If the in-process submit() is undefined or
      always null, US2-21's twin comparison compares null with null.
    remedies:
      - "State the in-process semantics of submit() in contracts/testing.md. For example, a capture-phase submit listener that records event.submitter and new FormData(form, submitter), and then calls preventDefault. Record that the fixture harness additionally proves the request body. Add a plant (implicit submission never fires, or always fires) that turns US2-21 red in process."
  - id: PLAN-TESTABILITY-1-006
    severity: 3
    title: "Native-twin comparisons (SC-003, US2-6, US2-21) pass vacuously when both sides are empty, null or equally wrong; there is no plant for the twin suites"
    evidence:
      - artifact: "spec.md SC-003: 'the form data and validity flags of each form element equal those of a native <input> or <select> ... entry by entry'; plan.md Constitution Check VIII: 'Native-twin comparisons for forms (SC-003)'"
      - artifact: "contracts/testing.md § Plants: the form plants target US2 scenarios 2 and 4 only, not the twin suites; submit() returns null for 'no submission'"
    claim: |
      An equality test whose two sides come from the same helper is satisfied when the helper reads nothing. Examples:
      a wrong form id gives two empty FormData, a recorder that never fires gives null and null, and a reset or
      restore step that silently does nothing leaves the twin and the element in the same initial state. The SC-003
      matrix (name, required x empty/non-empty, disabled, fieldset, as set/after reset/after restore) and US2-21's
      three forms can all be green while the element does not take part in the form at all. In the cases where the
      native twin itself submits nothing, nothing in the test can tell.
    remedies:
      - "Require every twin comparison to also assert the native twin's expected outcome absolutely, for example by a small table in contracts/testing.md (form 1 submits with title=..., form 2 submits, form 3 does not; valueMissing true for required/empty, and so on), so each combination has at least one non-empty, non-null side. Add a plant to the SC-003 and US2-21 suites (a control that never calls setFormValue on reset or restore; implicit submission that ignores the one-field rule) that must turn them red."
  - id: PLAN-TESTABILITY-1-007
    severity: 2
    title: "The element plants have no runner and no record, and five plants do not cover 'each new assertion family'"
    evidence:
      - artifact: "contracts/testing.md § Plants: 'Each new assertion family has a planted defect that turns it red ... The plants are test fixtures under test/fixtures/, not shipped.' Listed: never-withhold, withhold-on-first-load, nested region, missing setFormValue, reset keeps typed value"
      - code: "gates/gates.json and gates/plants/**: plants are run by the plants gate only for gates; packages/elements/test/ has no mechanism that runs a scenario body against a planted element and expects failure (005's element plants appear as comments in test/scenarios/*.ts, e.g. scenarios/slot.ts:14-25)"
    claim: |
      The plan does not say who runs a plant fixture, against which scenario, or where the red output is recorded. A
      plant in test/fixtures/ that no test imports proves nothing. The listed plants also leave several assertion
      families without a defect shown to turn them red: politeness (assertive vs polite), move detection (US2-20 move,
      edge case), error normalisation and baseline reset (US2-10), host ARIA combination (R-05), the
      heading-absent zero gap (SC-004), validity mirroring (US2-5, 6), select option mirroring (US3-4) and the
      twin suites (PLAN-TESTABILITY-1-006).
    remedies:
      - "In contracts/testing.md, define how a plant is run: a test that runs the named scenario body against the planted element and asserts that it fails with the expected assertion message, or a recorded red run kept with the phase review. Extend the plant list to one plant per family above, or state for each family why its red-first run already shows it can fail."
  - id: PLAN-TESTABILITY-1-008
    severity: 2
    title: "The capture's oracle code (the region-text reading and announcements()) is test code: it is not mutated, and the reading has no planned unit tests"
    evidence:
      - artifact: "contracts/testing.md: 'announcements(snapshots) is a pure function ... It has unit tests of its own'; the snapshot's text is 'the spec's reading' computed inside the capture, with no tests named for it"
      - artifact: "spec.md § What 'announced' means here: StaticText and img names, img descendants skipped, link names skipped, inline text boxes skipped, ignored nodes contribute nothing"
      - code: "stryker.elements.config.json and vitest.mutation.elements.config.ts mutate packages/elements/src/** via the 'elements' project only; packages/elements/test/live.ts is outside that set"
    claim: |
      Every announcement verdict depends on two pieces of test code. The text reading has several rules, and a reading
      that takes a link's own name or an img's descendants changes US1-19's strings. announcements() has three listed
      vacuous cases. Neither piece is measured by mutation, and the reading has no unit tests at all. A weak oracle
      here makes every announcement test weak.
    remedies:
      - "Split the reading into a pure function over recorded AX node lists with unit tests per rule (StaticText, img without descendants, link name skipped, ignored subtree, whitespace), using real getFullAXTree fixtures from the spike. Mutate test/live.ts's pure functions with their unit tests (for example a node-project Stryker entry), or record why not."
  - id: PLAN-TESTABILITY-1-009
    severity: 2
    title: "With Timeout counted as a kill (007), a debugger-pausing capture lets hanging mutants and a hanging recorder pass the mutation gate"
    evidence:
      - artifact: "plan.md Constitution Check VIII: 'Timeout and CompileError on changed lines are reported, not failing (007)'"
      - code: "gates/lib/mutation/report.ts:72 const passing = new Set([\"Killed\", \"Timeout\", ...])"
      - artifact: "research.md § R-01: every mutation in the watched subtree pauses the page until the test side resumes it"
    claim: |
      The announcement code observes its own light DOM (the heading MutationObserver of R-02, the select's option
      observer of R-07) and toggles attributes that the recorder watches. Mutants that remove a guard or a
      restart-on-pending check can loop mutations. Each mutation then becomes a pause and a CDP round trip, and the
      test times out. A timeout ends as Timeout, which passes. The same happens if the capture deadlocks. That leaves
      exactly the announcement code with a silent pass route.
    remedies:
      - "Bound the capture: a maximum snapshot count and a per-step deadline that fail the test with an assertion ('capture exceeded N pauses') well before the Vitest and Stryker timeout, so these mutants end Killed. State in the plan that Timeouts in src/live.ts and src/form-control.ts are reviewed one by one."
  - id: PLAN-TESTABILITY-1-010
    severity: 2
    title: "SC-002's matrix (five tones x triggers x three role rows) is not planned as tests; phase 2 lists only scenarios 1 to 19"
    evidence:
      - artifact: "spec.md SC-002: 'For each of the five tones, ... exactly one announcement per triggering change ... and zero for each non-triggering one ... for each supported host role row of FR-009'"
      - artifact: "plan.md § Phases 2: 'the notice scenarios 1 to 19 red first'; no task or contract names the SC-002 matrix"
    claim: |
      Scenarios 8 to 17 sample tones and triggers. SC-002 asks for the full matrix, including every non-trigger
      (re-render, move, announce set later, change while hidden) for each tone and for the alert and status rows. If
      the matrix is not named in the plan, /speckit-tasks will not generate it, and SC-002 will be claimed from a
      sample.
    remedies:
      - "Add the SC-002 matrix to phase 2 as a named, table-driven scenario body (tone x trigger x role row), with no conditional assertions and one expected count per cell, and list it in quickstart step 2."
  - id: PLAN-TESTABILITY-1-011
    severity: 1
    title: "'Removed and inserted again in a later task' is not tied to the MessageChannel that clears the move flag"
    evidence:
      - artifact: "research.md § R-02 Move in one task: the flag is cleared by a message on a module-level MessageChannel; 'A removal and an insertion in different tasks are therefore an insertion'"
      - artifact: "spec.md Edge Cases: 'A notice removed and inserted again in a later task is a new insertion and is announced'"
    claim: |
      If the scenario makes its 'later task' with setTimeout(0), the outcome depends on the order between the
      MessageChannel task source and the timer task source. The HTML standard leaves that order to the user agent, so
      the test can pass or fail for scheduling reasons rather than because of the behaviour.
    remedies:
      - "Give the driver a 'later task' step that waits for a frame, or for a MessageChannel round trip of its own posted after the removal, and state it in contracts/testing.md."
