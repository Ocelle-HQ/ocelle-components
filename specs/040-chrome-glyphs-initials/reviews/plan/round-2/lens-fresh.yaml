  - id: PLAN-FRESH-2-001
    severity: 2
    title: "Control characters still opt a button into the initials presentation"
    evidence:
      - artifact: "spec.md FR-003 rejects whitespace and wholly default-ignorable clusters. SC-002 requires legible initials. The Phase 2 rejection table covers U+200B and U+2060."
      - code: "Node probe on U+0007 BELL and U+0000 NULL: each survives String.trim(), segments into one cluster with Intl.Segmenter, and matches neither the whitespace nor Default_Ignorable_Code_Point regex."
    claim: |
      A host can assign either control character through the public string property. The revised predicate requires an ochre plate and preservation of the control character, although the character conveys no readable initial. The earlier default-ignorable examples and their fixes remain valid.
    remedies:
      - "After trimming, reject values containing Unicode General_Category=Control (Cc). Exercise a live property assignment of U+0007 and check ordinary rendering and the unchanged action name. Keep the combining and joined examples accepted."
