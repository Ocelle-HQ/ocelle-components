schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: testability
findings:
  - id: PLAN-TESTABILITY-1-001
    severity: 2
    title: "ASCII examples cannot verify the grapheme acceptance boundary"
    evidence:
      - artifact: "contracts/chrome-controls.md § Initials button promises one or two Unicode grapheme clusters after trimming and rejection of internal whitespace. plan.md § Phase 2 specifies a single initial and a wide two-letter value."
      - code: "A Node probe with Intl.Segmenter gives two segments for e + combining acute + W, while Array.from counts three code points. Both algorithms count WW as two."
    claim: |
      The planned valid examples let code-unit and code-point counting pass. They also do not distinguish trimming from rejecting surrounding whitespace or prove fallback on an internally separated pair.
    remedies:
      - "Add a table to phase 2 with a padded decomposed accent plus W and a multi-code-point emoji sequence as accepted inputs, verifying exact unchanged text. Test blank, three graphemes and internal whitespace as ordinary presentation. Exercise the same host through accepted and rejected updates."
  - id: PLAN-TESTABILITY-1-002
    severity: 2
    title: "A fixed 44 px rail oracle fails at the planned enlarged root size"
    evidence:
      - artifact: "plan.md § Phase 2 calls for a standard 44 px reference and measuring both native target axes, including 200% root text. contracts/chrome-controls.md calls the target 44 px without specifying the reference root size."
      - code: "packages/tokens/src/source.ts:213 defines target-min as 2.75rem. packages/elements/src/ocelle-button.ts:148 applies it to both native target dimensions, yielding a minimum of 88 CSS px at a 32 px root."
    claim: |
      A fixed pixel expectation at the enlarged root rejects a correctly scaled control. An assertion checking only the default-size reference cannot establish geometry preservation in the enlarged case.
    remedies:
      - "State that 44 CSS px applies at a 16 px root. Compare independently measured treated and ordinary controls at each tested root size, and check both against the resolved target token in that fixture."
