schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: fresh
findings:
  - id: PLAN-FRESH-1-001
    severity: 2
    title: "An invisible format character qualifies as a visible initial"
    evidence:
      - artifact: "contracts/chrome-controls.md § Initials button accepts one or two non-whitespace Unicode grapheme clusters. spec.md SC-002 promises legible initials."
      - code: "Node probe with Intl.Segmenter, String.trim and the Unicode whitespace regex: U+200B ZERO WIDTH SPACE and U+2060 WORD JOINER each survive trimming, count as one grapheme and do not match whitespace."
    claim: |
      A caller can supply a visually empty value that activates the ochre mark while displaying no initials. This also distinguishes a pasted zero-width space from an ordinary blank value in a way the user cannot see.
    remedies:
      - "Require each accepted cluster to contain a visible base, specify an implementable predicate (for example, a Unicode letter or number for initials), and add a zero-width-only fallback case alongside a decomposed letter that retains its combining mark."
  - id: PLAN-FRESH-1-002
    severity: 2
    title: "The 44 px target requirement conflicts with the enlarged root-text fixture"
    evidence:
      - artifact: "contracts/chrome-controls.md § Initials button says the mark sits inside its existing 44 px target. plan.md § Phase 2 specifies the 44 px comparison and repeats measurements with 200% root text."
      - code: "packages/tokens/src/source.ts:213 defines target-min as 2.75rem. packages/elements/src/ocelle-button.ts:148 applies the token on both axes. A 32 px root gives an 88 px minimum."
    claim: |
      A literal 44 px measurement at 200% would reject the existing correctly scaled reference button. Implementing that fixed measurement would instead shrink the treated target relative to its sibling.
    remedies:
      - "Describe 44 px as the 16 px-root example. At each scale measure the resolved target-min token and compare treated and reference control boxes at the same root size."
