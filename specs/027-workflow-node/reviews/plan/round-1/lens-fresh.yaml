findings:
  - id: PLAN-FRESH-1-001
    severity: 2
    title: "A reused selection button can request a different step after a host update"
    evidence:
      - artifact: "spec.md:24,67,92 require a stable ID across activation and rename; contracts/workflow-node.md:7,18 expose a writable ID and one native activation path without specifying when a host may reuse the element for a different step."
      - code: "Lit 3.3.3 / Chromium 1248 probe: mouse down on Security review, set the mounted element's title and ID to Planning and plan, await updateComplete, then release at the same point. The inner button remained the same DOM object and emitted a request for plan."
    claim: |
      A canvas keyed by position can bind a different step to the same native button during a pointer gesture. The request can end up naming a different step from the one the user started selecting even though the host gave each logical step a stable ID. The contract leaves the node instance's identity lifetime unstated, so a consumer could reuse the instance this way and still appear to meet the documented inputs.
    remedies:
      - "State that the host keys each mounted node by its stable ID and uses a different element when it binds a different step. Keep title and data updates on the existing keyed node. Show the binding in the integration guide and add a browser case that replaces the pressed node with a different ID before release and verifies that the gesture produces no request for the replacement."
