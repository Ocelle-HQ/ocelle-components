lens: correctness
# Checked against: spec.md, plan.md, research.md, data-model.md, contracts/elements-overlays.md, contracts/checks.md,
# quickstart.md, constitution 1.3.1, and the repository at base e6404b7 (packages/elements/scripts/manifest.ts,
# custom-elements-manifest.config.mjs, test/node/manifest.test.ts, test/node/readme.test.ts, test/build/*.test.ts,
# src/naming.ts, src/index.ts, README.md, packages/tokens/src/source.ts and generate.ts, gates/bin/brand-rules.ts,
# gates/bin/csp.ts, stryker.elements.config.json, vitest.config.ts) and origin/claude/010-storybook-workbench
# (gates/lib/capture-plan.ts, specs/006 FR-012/FR-031). Settled as correct, not reported: token groups and ref rules
# (generate.ts recordProblems), brand rule (f) only checks motion-fast/motion-base (brand-rules.ts:191), chrome-ink on
# chrome already contrast-checked (source.ts:58), csp plant pass-function-timer exists, mutation scope covers all of
# packages/elements/src (mutation.ts:73), no browserslist/engines/build.target declares a floor, #10's capture context
# (1280x800, reducedMotion reduce, animations disabled, fullPage) as R-16 states.
findings:
  - id: PLAN-CORRECTNESS-1-001
    severity: 3
    title: "Escape in a nested overlay also reaches the overlay beneath: R-02's bubble-phase keydown has no topmost test"
    evidence:
      - artifact: "research.md § R-02 Decision: 'the overlay handles Escape on `keydown` (bubble phase, on its `<dialog>`), calls `preventDefault()` and runs the request path'; spec FR-010 'while the overlay is the topmost open one', FR-023 'Escape, the close control and the backdrop act only on the topmost'"
      - code: "Composed-path reasoning: an `ocelle-dialog` slotted into an open `ocelle-drawer` (the matrix row 'nested dialog over drawer', contracts/checks.md:25) sits in the drawer's default slot, which is inside the drawer's `<dialog>`. `keydown` is composed, so an Escape from inside the inner dialog propagates inner <dialog> -> inner shadow root -> inner host -> drawer's slot -> drawer's <dialog>. Both bubble-phase listeners run; R-02 calls preventDefault but neither stopPropagation nor a defaultPrevented/topmost check, and `:modal` matches both dialogs."
    claim: |
      As designed, one Escape in the inner dialog dispatches two close requests (inner, then drawer) and, if neither is
      cancelled, closes both overlays. That breaks FR-010/FR-023 and the edge case 'Two overlays: Escape and its close
      affect only the topmost; focus returns into the drawer'. The plan states no mechanism for "topmost"; the test row
      exists, but the design it would test is wrong.
    remedies:
      - "R-02: state the topmost rule, e.g. a module-level stack of open overlays (push on open, remove on close/disconnect) and the keydown handler acts only when its overlay is the top of the stack and the event is not already defaultPrevented; do not stopPropagation (hosts may listen). Add the stack to data-model § State and a matrix row 'nested: one Escape closes only the inner; drawer stays open; one request event in total'."

  - id: PLAN-CORRECTNESS-1-002
    severity: 3
    title: "A bubble shown outside a modal stays shown under it and swallows the first Escape meant for the modal"
    evidence:
      - artifact: "research.md § R-10 'the bubble is `<div part=\"bubble\" popover=\"manual\">`'; § R-12 Escape: 'while a bubble is shown, a `keydown` listener in the capture phase on `window` takes Escape, hides the bubble, and calls `preventDefault()` and `stopPropagation()`. An overlay's keydown (R-02) never sees it.'; spec FR-010 'no tooltip bubble inside it is shown'; FR-034 'above any open dialog or drawer and their backdrops'"
      - code: "HTML showModal() runs 'hide all popovers until' the document, which closes the auto (and hint) popover stacks only; a `popover=manual` element stays open. Scenario: pointer rests on a tooltip-wrapped icon button (bubble shown by hover); the user clicks it or presses Enter on another control and the host opens an `ocelle-dialog`. Nothing in R-12 hides the bubble (no pointerleave until the pointer moves; focusout only matters for focus-shown bubbles). The dialog, shown later, is above it in the top layer, so the bubble is painted under the backdrop; R-12's window listener is still installed."
    claim: |
      The first Escape the user presses to close the new dialog is taken by a bubble that is not inside the dialog and
      is half-hidden under its backdrop, so the dialog needs two presses. That contradicts FR-010 (the request is
      suppressed only by a bubble inside the overlay) and FR-034's "above any open dialog". #16's first consumer opens
      the Open project dialog from a control, and #12's icon-only nav item is the exact trigger shape.
    remedies:
      - "R-10/R-12: hide the current bubble whenever an overlay opens (the overlay base calls the tooltip module's hide-current, both internal to the package), and make the Escape listener act only when the bubble's trigger is not inert (inside the topmost modal or with no modal open). Add matrix rows 'bubble shown by hover, then a dialog opens: bubble hidden; one Escape closes the dialog' and the same for the drawer."

  - id: PLAN-CORRECTNESS-1-003
    severity: 3
    title: "Placement writes physical coordinates into a logical inset: wrong under rtl, and no rtl tooltip row"
    evidence:
      - artifact: "research.md § R-11: 'calls `replaceSync()` with one rule `[part=\"bubble\"] { inset-block-start: <y>px; inset-inline-start: <x>px; }`' and 'measure the trigger's border box'; spec FR-030 'placement ... (logical under the element's direction)'"
      - artifact: "contracts/checks.md:27 tooltip row: 'each placement; flip; cross-axis clamp' with no `dir` dimension (the drawer row has `side` x `dir`); data-model § Stories tooltip list has no rtl story"
      - code: "getBoundingClientRect() returns physical left/top from the viewport's left edge. With `direction: rtl` inherited by the bubble, `inset-inline-start` maps to `right`, so an x measured as a left offset places the bubble mirrored across the viewport."
    claim: |
      The mechanism as written puts the bubble in the wrong place in every right-to-left page, and nothing in the test
      matrix or stories would catch it, although FR-030 makes placement logical under the direction.
    remedies:
      - "R-11: write physical `top`/`left` in the placement rule (coordinates are viewport-physical; the logical decision is only which side `start`/`end` means), and add tooltip matrix rows and a story for `start`, `end` and a flip under `dir=\"rtl\"`."

  - id: PLAN-CORRECTNESS-1-004
    severity: 2
    title: "Moving from trigger to bubble fires pointerleave on the trigger first; R-12's rule hides the bubble on the crossing"
    evidence:
      - artifact: "research.md § R-12 Pointer: '`pointerenter` on trigger or bubble ... shows at once when it is already shown or the delay is 0 ms. `pointerleave` from both clears the timer and hides unless keyboard focus holds.'; § R-11 'the pointer therefore goes from trigger to bubble without leaving both, and no timer is needed for the crossing'"
      - code: "UI Events boundary order: on a move from A to B the browser dispatches pointerout/pointerleave to A before pointerover/pointerenter to B. With per-element tracking, after the trigger's pointerleave neither element is marked hovered, so the bubble hides; the following pointerenter on the bubble (if still dispatched to a just-hidden popover) finds it not shown and starts the 500 ms delay."
    claim: |
      The padded hit box removes the geometric gap but not the event-order gap, so the design as specified flickers or
      drops the bubble on the very move WCAG 1.4.13 'hoverable' requires (FR-032, US3-2). The 'hoverable gap' test row
      would fail against the stated mechanism.
    remedies:
      - "R-12: track hover with pointerenter/pointerleave on the tooltip host (the bubble is in the host's shadow tree, so moving trigger -> bubble does not leave the host), or decide the hide from `relatedTarget`/a next-frame `:hover` check; state which and keep the matrix row."

  - id: PLAN-CORRECTNESS-1-005
    severity: 2
    title: "Re-placing on window scroll capture misses scrollers inside shadow roots, including the overlay's own body"
    evidence:
      - artifact: "research.md § R-11: 'While shown, it is re-placed on `scroll` (capture, any scroller) and `resize`'"
      - code: "`scroll` is fired with composed=false, so its propagation path ends at the shadow root of the scroller; a capture listener on window never sees a scroll of an element inside a shadow root. The dialog/drawer body that scrolls (FR-018, part `body`) is in the overlay's shadow root, and #12's shell scrollers will be in `ocelle-app-shell`'s shadow root."
    claim: |
      A bubble shown by keyboard focus on a trigger inside a scrolling dialog body, or a nav item in #12's scrolling
      sidebar, stays where it was while the trigger scrolls away, which breaks FR-035's placement beside the trigger
      in two of the named consumer contexts (US3-5 'inside an open dialog or drawer').
    remedies:
      - "R-11: while shown, re-place on a per-frame check of the trigger's rect (the plan already allows one placement per frame), or attach scroll listeners to each scrollable ancestor along the composed parent chain at show time; add a matrix row 'trigger inside a scrolled dialog body: bubble follows'."

  - id: PLAN-CORRECTNESS-1-006
    severity: 2
    title: "Manifest plan points at the wrong file, breaks a tested 005 rule, and gives no mechanism for parts, slots, hooks and prefixed events"
    evidence:
      - artifact: "research.md § R-01 Manifest: 'the manifest script analyses `src/ocelle-*.ts` only (`custom-elements-manifest.config.mjs`) ... If not, the glob gains `src/overlay.ts`'; plan Constitution Check I 'Every property, attribute, event, slot, part and own CSS custom property is in the generated manifest'"
      - code: "packages/elements/scripts/manifest.ts:36 `const element = /^ocelle-[\\w-]+\\.ts$/;` and :120 filter the modules the gate generates from; the .mjs config is only for the CLI (its own header says so). test/node/manifest.test.ts:205 'reads every src/ocelle-*.ts ... and nothing else of src/' pins that rule."
      - code: "grep '@fires|@csspart|@slot|@cssprop' packages/elements/src: no match; custom-elements.json has empty events/slots/cssParts for both 005 elements, so no existing element shows how these lists get filled. R-01 has the base dispatch events whose names are built from a subclass prefix, which the analyzer cannot read as event names."
    claim: |
      The fallback in R-01 would change the generator and contradict a pinned 005 test, which the plan does not list,
      and the plan never says how FR-017's slots and parts, FR-024's hook, and SC-003's exactly-two events per overlay
      with their detail types (FR-045) reach the manifest. SC-003 and FR-045 cannot be met by the generator as it is
      without a stated mechanism.
    remedies:
      - "R-01: declare slots, parts, the CSS hook and the events with JSDoc on each concrete class (`@slot`, `@csspart`, `@cssprop`, `@fires ocelle-dialog-close-request {CustomEvent<{reason: ...}>}`), measured in phase 2's first task; if the base must be analysed, name scripts/manifest.ts and test/node/manifest.test.ts as changed files with a red test for the new rule."

  - id: PLAN-CORRECTNESS-1-007
    severity: 2
    title: "Spec and plan still disagree on the tooltip's semantics and FR-034's wording; the plan defers the spec edit"
    evidence:
      - artifact: "spec FR-036 'The bubble has role `tooltip`' and 'with `describes` the text is the trigger's accessible description' (unconditional); FR-029 'a custom element's host whose inner control is focusable' is a valid trigger"
      - artifact: "research.md § R-13 'the bubble has `aria-hidden=\"true\"`' and 'describes is supported only when the trigger itself is the focusable element'; 'The plan squad decides whether the spec takes this wording'; plan.md Decisions 5"
      - artifact: "spec FR-034 'MUST not be light-dismissed by a click elsewhere other than by hiding' (garbled); research.md 'Spec-check notes': 'SPEC-1-07 ... The spec wording is for the squad fix.'"
    claim: |
      Tasks and tests are generated from the spec; as it stands they would require a role=tooltip bubble (which R-13
      hides from the tree) and a description on custom-element triggers (which R-13 does not support). The artifacts
      contradict each other on behaviour that FR-044 asserts in the accessibility tree.
    remedies:
      - "Amend spec FR-036 to 'the description node has role tooltip; the painted bubble is hidden from the tree', state FR-029/FR-036's limit that `describes` needs a self-focusable trigger (US3-7 Given clause too), and reword FR-034 to 'is not light-dismissed (popover=manual); it hides only by FR-032/FR-033'."

  - id: PLAN-CORRECTNESS-1-008
    severity: 2
    title: "README and build outputs are pinned by tests the plan does not list; the engine-floor change is not documentation-only"
    evidence:
      - artifact: "plan.md Constitution Check VIII 'Documentation-only items take the exemption with the reason stated'; Phases 4 'README § Engines to WebKit 17'; Project Structure lists no test/node/readme.test.ts, test/build/*.test.ts or entry tests"
      - code: "packages/elements/test/node/readme.test.ts:65 pins 'Engine floor: Chromium 120+ and WebKit 16.4+, with no `window.ShadyCSS` polyfill on the page'; README.md:4 'This release has two elements'; test/build/build.test.ts:44-49 pins dist files ['browser.js','index.js','ocelle-brand-mark.js','ocelle-icon.js']; test/build/pack.test.ts:20-21; test/entry-icon.test.ts per entry point"
    claim: |
      FR-040's README change makes an existing test fail, so it is a behaviour-tested change that needs its red step,
      not an exemption; and the three new entry points need the entry, build and pack tests 005 established. Without
      them in the plan the tasks will either miss them or break gates late.
    remedies:
      - "Add to Project Structure and the phases: readme.test.ts fragments (Engines floor, the three element sections, tokens read), the README intro line, build.test.ts and pack.test.ts file lists, and entry-dialog/drawer/tooltip.test.ts (each entry defines its tag, plus ocelle-icon for the overlays)."

  - id: PLAN-CORRECTNESS-1-009
    severity: 2
    title: "Disconnect goes to 'closed' while `open` stays true; reconnect (a DOM move) is undefined"
    evidence:
      - artifact: "data-model.md § Overlay State 'any ──(disconnected)──▶ closed (no event; ...)'; spec FR-004 '`open` ... the single source of truth for being shown ... the element sets it to false whenever it closes'"
      - code: "Removal from the document removes the inner <dialog> from the top layer (HTML removing steps), but nothing in the plan clears `open`; Lit keeps the property across disconnect/reconnect, and frameworks and htmx moves re-insert the same node."
    claim: |
      After a move, the element reports `open === true` with no dialog shown and no inert page, contradicting FR-004;
      or, if the plan sets `open` false silently, it is a close without the close event FR-014 requires. Either way the
      state machine is incomplete for a common host operation.
    remedies:
      - "Decide and record in data-model: (a) disconnect keeps `open` and reconnect re-runs the open path (showModal, initial focus, opener kept), or (b) disconnect sets `open` false with no event and the README says so; add a matrix row 'moved while open'."

  - id: PLAN-CORRECTNESS-1-010
    severity: 2
    title: "R-02's cancel fallback dispatches a vetoable request for a cancel the platform will not let be vetoed"
    evidence:
      - artifact: "research.md § R-02: 'It also listens to `cancel` and always calls `preventDefault()`. If a `cancel` arrives for a press the keydown path did not handle ..., it runs the request path once for it. So the veto holds on every repetition'"
      - code: "probes/probe2.cjs result recorded in R-02: the second Escape without user activation fires `cancel` with `cancelable: false` and the dialog closes. preventDefault() on a non-cancelable event has no effect."
    claim: |
      On any path where a non-cancelable `cancel` reaches the dialog (close-watcher grouping, a back gesture, an engine
      ordering keydown differently), the host receives a cancelable request, cancels it, and the overlay closes anyway,
      which is exactly what FR-013 and US1-4 forbid; the claim 'the veto holds on every repetition' is not true for
      this branch.
    remedies:
      - "R-02: run the request path from `cancel` only when `event.cancelable` is true; a non-cancelable cancel is a platform close handled by R-03 (reason `host`), and the README states it. Add an in-process row that dispatches a synthetic non-cancelable `cancel`."

  - id: PLAN-CORRECTNESS-1-011
    severity: 2
    title: "FR-018's keyboard scrolling of the body has no design, and the dialog row tests no long body"
    evidence:
      - artifact: "spec FR-018 'the body is reachable by keyboard scrolling when it overflows'; research.md § R-04 focusable.ts walk excludes nothing but adds no scroller; contracts/checks.md:25 dialog row has no long-body path (only the drawer row says 'long body scroll')"
      - code: "Initial focus falls back to the close control in the header (FR-007), outside the body scroller, so arrow and Page keys do not scroll the body. Chromium makes scrollers without focusable children keyboard-focusable by itself (since 130); WebKit does not, so the tab order and focusable.ts's 'last tabbable' disagree between engines."
    claim: |
      A requirement and US1-10's long body are not met by any planned mechanism, and the Tab wrap computed by
      focusable.ts will not match the platform's tab stops in Chromium when the body is a focusable scroller.
    remedies:
      - "Plan: give the `body` part `tabindex=\"0\"` (and a name) while it overflows (ResizeObserver), include it in focusable.ts's order, and add a dialog matrix row 'long body: body reachable by Tab and scrolls with arrows'."

  - id: PLAN-CORRECTNESS-1-012
    severity: 2
    title: "Host aria-label rule copied from 005 without its basis: the overlay host has no role, so it becomes a second named node"
    evidence:
      - artifact: "research.md § R-08 'When the host has an `aria-label` attribute, the `<dialog>` gets `aria-label` with that value instead ... `naming.ts`'s `accessibleName` decides'; spec US1-8 'one node with role `dialog` ... named'"
      - code: "packages/elements/src/naming.ts:3-4 'Chromium names the host from a present `aria-label` whatever the element sets'; 005 made that harmless by `expose()` giving the host `internals.role = \"img\"` (naming.ts:24-29). The overlay host is a generic element with no internals role."
    claim: |
      With a host `aria-label` the tree gets a named generic host wrapping a named dialog, which the plan neither
      asserts nor covers with a story (data-model § Stories has no aria-label story), and axe may flag a name on a
      generic. The README § Host ARIA rule the plan cites was proven only for elements whose host carries the role.
    remedies:
      - "R-08: state how the host is exposed when it carries `aria-label` (measured in Chromium), add an accessibility-tree assertion for the host-`aria-label` case to FR-044's set and a story so axe runs on it; if the result is a duplicate named node, record the limit in the README § Host ARIA for overlays."

  - id: PLAN-CORRECTNESS-1-013
    severity: 2
    title: "The tooltip host's own layout is undefined, yet it wraps #7's ellipsised pill and #12's rail item"
    evidence:
      - artifact: "data-model.md § ocelle-tooltip and contracts § '#7 and #12': `<ocelle-tooltip ...><button class=\"pill\">${this.text}</button></ocelle-tooltip>`; no `:host` display or sizing decision anywhere in research.md"
      - code: "README.md § Element conventions 'Every element's styles hold `:host([hidden]) { display: none; }` beside its `:host` display rule'. An ellipsis needs the button's inline size constrained by its container; a default `display: inline` host between the pill's container and the button breaks that constraint, and in #12's rail the wrapper sits between the nav list and the link."
    claim: |
      The consumer interfaces the spec names (#7 'full text as tooltip' when ellipsised, #12's icon-only nav item) depend
      on the wrapper being layout-transparent, and the plan does not decide it or test it, so the first consumer may
      find the pill no longer truncates inside the tooltip.
    remedies:
      - "Decide the tooltip host's display (e.g. `inline-block` with `max-inline-size: 100%`, or a stated alternative) in R-11/data-model and add a scenario: a pill-shaped button inside a narrow container still ellipsises when wrapped, and the trigger's box equals its unwrapped box."

  - id: PLAN-CORRECTNESS-1-014
    severity: 1
    title: "Slot name `ocelle-description` breaks constitution I's plain slot names"
    evidence:
      - artifact: "research.md § R-13 `<span slot=\"ocelle-description\" ...>`; data-model.md:95; contracts/elements-overlays.md:70"
      - artifact: "constitution I: 'Parts and slots keep plain names.'"
    claim: |
      The name is visible in hosts' light DOM and documented in the contract, so it is surface-like and should follow
      the principle; the plan's Constitution Check I does not mention it.
    remedies:
      - "Rename to a plain slot name (e.g. `description`) in research, data model and contract."

  - id: PLAN-CORRECTNESS-1-015
    severity: 1
    title: "Quickstart step 3 runs the wrong project for the tokens' computed values"
    evidence:
      - artifact: "quickstart.md step 3 '`pnpm vitest run --project tokens`: the three new tokens validate and are listed in the README and CHANGELOG'"
      - code: "vitest.config.ts:33 and :43 define `tokens` and `tokens-browser`; packages/tokens/test/expected.ts rows carry a computed-value probe that runs in the browser project (packages/tokens/test/browser)."
    claim: |
      The new rows in test/expected.ts are checked by `tokens-browser` as well; step 3 as written skips that check.
    remedies:
      - "Quickstart step 3: `pnpm vitest run --project tokens --project tokens-browser`."
