schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: a11y-security
findings:
  - id: PLAN-A11Y-SECURITY-1-001
    severity: 3
    title: "Pointer-open bubble cannot rely on Escape bubbling from its link"
    evidence:
      - artifact: "spec.md US3 scenario 2 requires dismissal on hover or focus, without dismissing the enclosing drawer on that Escape. research.md R4 only says to stop a handled Escape."
      - code: "packages/elements/src/overlay.ts:585–616 handles Escape for the modal regardless of which destination is focused. packages/elements/src/ocelle-tooltip.ts uses a capture listener for this reason. https://www.w3.org/WAI/WCAG22/Understanding/content-on-hover-or-focus.html requires dismissal without moving pointer or keyboard focus."
    claim: |
      A pointer-open bubble and keyboard focus can belong to different controls. A key listener on the nav item or native link then never sees Escape, and the drawer closes instead. A global capture listener with no ownership check can also steal Escape from a newer modal. The validation guide never separates hover from focused-control Escape.
    remedies:
      - "Specify ownership-aware capture dismissal for the visible bubble while focus is on another control, limit drawer interception to the active modal containing that bubble, and verify hover-only Escape with focus on the drawer close control, then Escape again."
  - id: PLAN-A11Y-SECURITY-1-002
    severity: 2
    title: "Rail and sidebar may announce indistinguishable landmarks"
    evidence:
      - artifact: "contracts/elements.md documents rail, sidebar and a navigation part without assigning responsibility for the navigation landmark names when projected together."
      - code: "packages/elements/src/ocelle-context-sidebar.ts:125–150 and packages/elements/src/ocelle-personal-rail.ts:131–165 give the landed hosts navigation roles and allow absent or host-overridden labels. https://www.w3.org/WAI/ARIA/apg/practices/landmark-regions/ calls for unique labels for same-role landmarks with different content."
    claim: |
      The mission shell exposes disjoint rail and context navigation together both wide and inside the drawer. Using the published slot contract alone, a host can get unnamed or identical navigation landmarks in the accessibility tree. If the shell uses a navigation wrapper around landed landmarks, it also creates a redundant nested landmark.
    remedies:
      - "Specify neutral layout wrappers for existing navigational landmarks and who supplies each distinct localizable label. Test the composed landmark names in both wide mission and narrow mission drawer, including the skip and main composition."
  - id: PLAN-A11Y-SECURITY-1-003
    severity: 2
    title: "The primary narrow menu lacks a documented minimum hit box"
    evidence:
      - artifact: "contracts/elements.md documents a native menu button, but plan.md Principle III and quickstart.md omit menu target sizing at 320 px."
      - code: ".specify/memory/constitution.md:56 requires primary actions to meet --ocelle-target-min. packages/tokens/src/source.ts:211 publishes 2.75rem. packages/elements/src/ocelle-button.ts:146–147 shows the corresponding two-axis implementation precedent."
    claim: |
      The menu is the only entrance to primary navigation in narrow layouts. Its native button semantics and visible focus do not ensure text and action pressure leave a usable hit area. The plan permits an icon-sized target while all described keyboard and main reflow checks still pass.
    remedies:
      - "Require the native narrow menu button to retain --ocelle-target-min in both axes and assert its measured hit area with a long product name and supplied actions at 320 px."
