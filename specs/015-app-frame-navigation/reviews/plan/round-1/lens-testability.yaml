schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: testability
findings:
  - id: PLAN-TESTABILITY-1-001
    severity: 3
    title: "The validation guide substitutes a static CSP scan for the live shell probe"
    evidence:
      - artifact: "plan.md:27 requires a strict CSP probe on an integrated shell; quickstart.md:10 only lists gate:csp after Storybook scenarios"
      - code: "gates/bin/csp.ts:1–11 statically parses package output and excludes Storybook. packages/elements/test/browser/serve.ts:39 serves the strict CSP fixture."
    claim: |
      The listed commands can pass without ever exercising a drawer or focus transition under enforced CSP. The scan does not observe DOM writes performed at runtime. The Storybook scenarios and scan therefore do not prove FR-010 in the integrated composition.
    remedies:
      - "Add an explicit built-output test to the existing strict browser project and validation guide. Load the real shell with external module and stylesheet resources under the fixture policy, exercise resize, drawer and skip focus, assert visible outcomes, and check policy violations with the existing fixture."
  - id: PLAN-TESTABILITY-1-002
    severity: 3
    title: "Storybook and built-output tests cannot kill the shell's source mutants"
    evidence:
      - artifact: "quickstart.md:6–9 assigns reflow, modal transition, bubble and skip cases to Storybook or unspecified fixtures; plan.md:16,31 names mutation generically"
      - code: "vitest.mutation.elements.config.ts:1–10 retains only elements and elements-touch. vitest.config.ts:98,162–164 excludes packages/elements/test/browser/** from elements; vitest.config.ts:220–224 runs that folder in a separate project."
    claim: |
      Source tests should exercise the behavioral branches directly in the mutation-instrumented browser projects. A contributor can follow the current validation layout with a complete live fixture and still leave the modal transitions, focus fallbacks or wide-to-narrow rule branches outside Stryker's test selection.
    remedies:
      - "Assign the behavior-driving Chromium scenarios to packages/elements/test/*.test.ts in the elements project, with representative scenarios reused by the built-output CSP project when practical. Require source assertions for tier choices, event details and focus fallbacks. Preserve the built-output and Storybook checks for their distinct coverage."
  - id: PLAN-TESTABILITY-1-003
    severity: 2
    title: "The drawer entry check can pass with the overlay's old focus order"
    evidence:
      - artifact: "spec.md:55 requires first destination in actual tab order; research.md:39 calls out the flat-order discrepancy; quickstart.md:6 only says to Tab through destinations after opening"
      - code: "packages/elements/src/overlay.ts:424 chooses autofocus or first flat-order control at open. packages/elements/src/focusable.ts:177 distinguishes positive tabindex in sequential order."
    claim: |
      Tabbing after opening does not establish the initial target. A fixture whose first DOM destination is also first sequentially can appear correct even if the shell forwards the existing autofocus behavior or focuses the drawer chrome first.
    remedies:
      - "Define a source browser fixture with at least two slotted destinations whose flat and sequential orders differ and, in a separate case, a competing autofocus candidate. Open with each supported input, assert the deep active element before any Tab, then assert forward and backward wrapping. Include the nested rail/sidebar composition."
