findings:
  - id: PLAN-FRESH-3-001
    severity: 3
    title: "A same-tier resize can discard the pending drawer focus restoration"
    evidence:
      - artifact: "data-model.md § Focus settlement states that a later resize invalidates older pending restoration. plan.md requires one settled transition per effective state change. spec.md § Focus on tier and layout changes requires focus to reach the old drawer destination where possible on leaving narrow."
      - code: "packages/elements/src/overlay.ts:475–498 defers dialog close and opener restoration until the exit animation finishes, then dispatches the close event used for shell settlement."
    claim: |
      With focus on a destination inside the drawer, drag the shell across the narrow boundary and continue resizing within the new collapsed tier before drawer exit completes. The subsequent observation provides no replacement focus transition, but the state model says it invalidates the pending one. The drawer's own opener can be hidden at its eventual close, and the user can lose focus rather than reaching the corresponding visible destination. The existing separate within-narrow and boundary checks do not exercise this sequence.
    remedies:
      - "Keep pending focus settlement across resize observations that do not supersede its effective target. Invalidate it only when a newer effective transition, deliberate user focus, or disconnection makes it stale, and preserve or recompute the target when a replacement transition is needed. Add a browser test that delivers a same-tier observation after leaving narrow and before the real drawer close event, then checks eventual focus on the same destination."
