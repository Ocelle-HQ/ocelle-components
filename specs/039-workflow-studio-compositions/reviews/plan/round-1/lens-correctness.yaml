schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: correctness
findings:
  - id: PLAN-CORRECTNESS-1-001
    severity: 3
    title: "Give missing reviewer bindings a real unassigned option"
    evidence:
      - artifact: "spec.md:21-22 requires Security review to start without a reviewer and binding the named reviewer to clear the finding. plan.md:22 chooses form-select without specifying its initial choice or synchronization with the host binding. data-model.md:8 stores the reviewer per step."
      - code: "packages/elements/src/ocelle-form-select.ts:81-82,110-146 ignores the host value attribute and defaults to the first enabled option if none is marked selected. packages/elements/src/form-control.ts:387-396 emits a change only when the committed value differs."
    claim: |
      Rendering only named reviewer choices can show a reviewer while the host still considers the step unassigned. With one available reviewer, selecting that already displayed value sends no change, so the author cannot clear the validation finding by following the planned route. Rebuilding or swapping the inspector can repeat the mismatch.
    remedies:
      - "Specify a real empty-value unassigned option and initialize the public select value from the selected step's authoritative binding when the inspector mounts or changes routes. Verify the enabled field initially shows Unassigned, a trusted transition to the named reviewer updates the correct step and clears the finding, and narrow/wide transitions keep the accepted choice."
  - id: PLAN-CORRECTNESS-1-002
    severity: 3
    title: "Define the host deletion action and reconcile all affected state"
    evidence:
      - artifact: "spec.md:24,85 specifies removal with Publish decision focus, the surviving previous step and Step/Add step fallbacks, and preserving unrelated focus. plan.md:26 describes focus recovery after removal, with no actionable removal route or host deletion transition. data-model.md:8-10 covers add, wiring and selection without removing state for a deleted key."
      - code: "packages/elements/src/ocelle-workflow-canvas.ts:68-70,718-726,1377-1393 has no Delete command and its native Step chooser only records a reveal target. Lines 530-532,1248-1272 project host-supplied selectedNodeId and transfer focus without changing that property. packages/elements/src/workflow-canvas-graph.ts:26-40 filters stale layout and dangling edges from the picture without mutating the input."
    claim: |
      Existing canvas recovery only runs after the host changes the graph. A test can directly replace that graph and observe Publish decision receiving focus while the actual composition offers no working delete action, retains the deleted selection or binding, or serializes an invisible dangling connection. The native reveal chooser alone also cannot serve as an operable host selection action for inspector-owned recovery.
    remedies:
      - "Specify one named, author-only host delete action that supports keyboard and tap and keys removal to the selected step. Document the atomic graph, incident connection, binding, layout, selection and inspector transition. Assert it through the actual control as well as named successor, previous, Step/Add step and unaffected-focus behavior. Use public host-owned focus actions for host-owned recovery, and keep the canvas's native recovery for focus it already owns."
