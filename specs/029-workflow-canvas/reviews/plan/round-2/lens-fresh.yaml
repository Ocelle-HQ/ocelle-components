schema: review-findings/v1
complete: true
phase: plan
round: 2
lens: fresh
findings:
  - id: PLAN-FRESH-2-001
    severity: 3
    title: "Excluded node actions still appear as focusable buttons to assistive technology"
    evidence:
      - artifact: "plan.md:37 and 41 exclude clipped or covered actions from sequential traversal, use the landed selectionTabIndex to control Tab, and preserve each existing action. The named navigator remains available."
      - code: "packages/elements/src/ocelle-workflow-node.ts:167 and 193–209 only remove a -1 action from sequential Tab. A pinned Chromium probe with two shadow roots and an offscreen foreignObject exposed the tabindex=-1 button in the AX tree as focusable. Its right edge was -235.98 CSS pixels, direct focus succeeded and a simulated activation ran its click listener. Applying inert to the HTML node wrapper removed the AX button and blocked direct focus while preserving the named control."
    claim: |
      A screen reader's button navigation can encounter an action that the canvas has classified as unavailable for visible focus. The sequential and hit tests in the plan can all pass while that alternative navigation offers the hidden native action instead of the visible named route.
    remedies:
      - "Define how ineligible map actions are excluded from the accessibility and user-activation paths while their named reveal stays available. For example, manage inert on a per-node HTML wrapper and capture focus before demoting it. Add a browser accessibility-tree case for a hidden map action before reveal and for the same native action after reveal, with correct focus and request counts."
  - id: PLAN-FRESH-2-002
    severity: 2
    title: "A scrollable host can hide an action inside the map's local bounds"
    evidence:
      - artifact: "plan.md:37–43 checks containment and later-painted map geometry and forwards programmatic focus with preventScroll. spec.md:23–25 requires visible focus after the named reveal and on recovery."
      - code: "Pinned Chromium probe nested a 250-pixel-tall SVG in a 100-pixel scrollable host pane. The native action was fully within its SVG. Calling focus with preventScroll left that hidden button active, the pane scroll offset at zero and a hit at the button's point on BODY. Default focus scrolled the pane to 111 CSS pixels."
    claim: |
      A node can satisfy the local map bounds and paint order inside a consumer's split or scrolling layout while a surrounding pane covers it. A programmed handoff with preventScroll can direct keyboard focus to that invisible action. Changing canvas viewport values alone does not establish a safe host scroll policy.
    remedies:
      - "Include effective ancestor clipping in programmatic focus eligibility and recover to an actually visible named control when the action cannot be exposed. Define when native ancestor scrolling is permitted and preserve the host-owned graph viewport. Add a named reveal or recovery in a scrollable consumer pane and check visible focus and the request stream."
  - id: PLAN-FRESH-2-003
    severity: 2
    title: "A shadow-host scroll can leave a captured preview stale before release"
    evidence:
      - artifact: "plan.md:47 and 79 require clearing a preview when the live coordinate frame changes, and verify a captured move at a stationary client point. The model records the transform and map dimensions but leaves the observation path open."
      - code: "Pinned Chromium probe scrolled an ancestor inside an enclosing shadow root. The SVG transform moved from Y 88 to 48 while its measured height stayed 100 CSS pixels. Scroll listeners observed one event in that enclosing shadow root and zero events on window, document and the canvas's own shadow root."
    claim: |
      The pre-dispatch check handles the settled false-request case. A preview can still remain stale until the next pointer sample when scroll occurs inside another component's shadow root. A size observer or a global capture listener misses that frame change.
    remedies:
      - "Specify how capture observes a changed frame across composed host boundaries, such as checking on animation frames only while capture is active. In the nested-shadow fixture, scroll the enclosing pane without moving or releasing the pointer and assert that the preview clears before the next pointer sample, then verify zero requests after release."
