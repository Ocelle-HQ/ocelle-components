schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: fresh
findings:
  - id: PLAN-FRESH-1-001
    severity: 3
    title: "Read-only navigation needs an accessible outcome-to-destination path"
    evidence:
      - artifact: "spec.md:54–64 and SC-004 require the reviewer to follow named outcomes. plan.md:37 hides the decorative edge group, contracts/workflow-canvas.md:15 removes edit controls in read-only mode, and the named navigation at line 34 locates a step by its name."
      - code: "packages/elements/src/ocelle-workflow-node.ts:155–156 and 215–217 give the landed node a list of descriptive outcome strings. They do not associate an outcome with a destination."
    claim: |
      A reviewer using the accessibility tree can read Approved and Rejected on Initial review and find Publish and Revise by name. The proposed read-only controls leave the pairing between each outcome and its destination unavailable to that reviewer. The illustrative quickstart can still pass by finding the two node names without following either connection.
    remedies:
      - "Keep an accessible source-scoped outcome-to-current-destination view using the supplied graph in both modes. Let reviewers follow its named destination through the existing reveal path. Prove Initial review / Approved leads to Publish and Rejected leads to Revise in read-only mode, with distinguishable destinations and only the expected navigation request."
  - id: PLAN-FRESH-1-002
    severity: 3
    title: "Overlapping graph cards can conceal a focused action"
    evidence:
      - artifact: "plan.md:35 keeps HTML node controls at screen size while zoom changes the distance between origins, then uses containment of the action and focus inset as the visibility criterion. spec.md:113 permits finite coordinates without a distinct-position constraint."
      - code: "Pinned Chromium 156 scratch probe with two opaque HTML cards in coincident SVG foreignObjects. The earlier native button was fully inside the SVG and held document focus, but elementFromPoint inside that button returned the later card's button."
    claim: |
      Fixed-size cards can overlap as the view zooms out or when a consumer supplies equal origins. A fully contained action can be covered by another card, so bounded roving or a named reveal can direct focus behind the upper card. Panning moves coincident origins together and leaves the covered target obscured.
    remedies:
      - "Make focus eligibility account for overlap and define the presentation behavior that exposes a named target with coincident origins while retaining its stable native action and the host's coordinates. Test the overlap produced by zoom and by identical supplied positions with actual keyboard focus, a visible indication and a successful pointer hit on the intended action."
  - id: PLAN-FRESH-1-003
    severity: 2
    title: "A scroll during drag changes the live coordinate basis"
    evidence:
      - artifact: "data-model.md:14 and 23 use the starting canvas-local pointer point and divide the delta by the captured scale. That snapshot explicitly records the authoritative layout and viewport. plan.md:41 calls for validating the current basis before dispatch."
      - code: "Pinned Chromium 156 pointer-capture probe. Both pressed and released clientY values were 150. Programmatic document scroll moved the SVG top from 100 to 60 and recalculation from live bounds changed the local point from 50 to 90. At scale two the resulting graph displacement was 20 with a stationary pointer and unchanged input values."
    claim: |
      The design leaves the DOM coordinate basis implicit. If the implementer subtracts a live surface origin from each sample while the recorded start sample remains in the old local frame, page or ancestor scroll can preview and submit a move the user did not make.
    remedies:
      - "Define a consistent coordinate basis for both pointer samples and how geometry-frame changes cancel the gesture before dispatch. Add a captured drag case that scrolls a host ancestor between samples and verifies the chosen cancellation behavior, preserved authoritative node positions and no unintended position request."
