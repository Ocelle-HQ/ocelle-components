schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: a11y-security
findings:
  - id: PLAN-A11Y-SECURITY-1-001
    severity: 3
    title: "The proposed Storybook route does not provide strict CSP"
    evidence:
      - artifact: "spec.md US3 and contracts/verification.md:10 require the built examples to run under the strict serving policy."
      - code: "storybook/README.md:26–28 documents a package-browser CSP test and a policy-free Storybook. storybook/scripts/externalise.ts:1–7 leaves inline scripts and style attributes in iframe.html. storybook/test/integration/render.test.ts:15–18 explicitly records the operator’s chosen boundary."
    claim: |
      The ordinary built Storybook browser integration can go green with no CSP header. Applying the required header to its preview entry would block its retained inline bootstrap. The planned package fixture by itself does not exercise both runnable example hosts, so it leaves the pressed-state and callback examples unproved under the policy.
    remedies:
      - "Keep the regular built Storybook interaction tests, and plan a separate strict-header browser fixture that mounts the same appearance and profile host modules with packaged imports and external assets. Assert the real header, zero policy violations and both host behaviors there. Follow the pane action footer precedent in storybook/README.md:44 and align the US3 verification wording and ownership with those two actual surfaces."
  - id: PLAN-A11Y-SECURITY-1-002
    severity: 3
    title: "Native Tab can move focus under the visible top-layer panel"
    evidence:
      - artifact: "contracts/element.md:11–15 keeps native Tab through external controls and supplies Escape only from the trigger or surface. contracts/verification.md:7 and :15 measure focus destinations and surface fit without checking visibility of external focus."
      - code: "Chromium 156 Playwright probe at 320×240. After Enter opened a shadow-local manual popover, three trusted Tabs reached the following external button. The popover was still open and its panel owned the browser hit at all four inside corners of that focused button."
      - code: "WCAG 2.2 SC 2.4.11 Focus Not Obscured (Minimum) requires an actually visible focused component or a way to reveal user-opened obscuring content without moving keyboard focus. https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum.html"
    claim: |
      The availability of a native stop, the panel's viewport fit and a focus ring in CSS do not guarantee visible focus. The panel can cover the next control entirely. For that focused external control the planned handler also cannot dismiss the panel on Escape without first moving focus again.
    remedies:
      - "Define behavior that keeps the focused outside control visible without stealing focus, such as repositioning the panel or dismissing it only when it fully obscures the newly focused control. Add a trusted Tab case where the next control deliberately lies behind the panel and assert observable visibility and unchanged external focus. Keep a separate unobscured reverse-Tab case."
  - id: PLAN-A11Y-SECURITY-1-003
    severity: 2
    title: "The manual Escape path can suppress a native surface control"
    evidence:
      - artifact: "spec.md FR-003 preserves native semantics of the ordinary slotted controls. contracts/element.md:13 defers to prevented keys, composition and foreground close watchers, then consumes this popover’s Escape."
      - code: "packages/elements/src/overlay.ts:616–627 defers when a nonempty search input is active. packages/elements/test/scenarios/dialog.ts:1162–1169 proves a slotted search field clears on Escape and stays focused with the overlay open. With a native shadow-local manual popover in Chromium 156, trusted Escape cleared the search value without a handler, and a scoped handler calling preventDefault and closing preserved the old value."
    claim: |
      A native default action has not yet happened when the keydown bubbles. Checking defaultPrevented cannot detect it. A consumer can put a search field in the promised ordinary controls and lose both native clearing and focus on the first Escape.
    remedies:
      - "Carry the existing overlay’s native search Escape exception into the popover contract. Prove a populated slotted search keeps focus and the panel open when the browser clears it, and that the next Escape from the emptied field closes and restores the trigger. Preserve ordinary Escape for other controls."
  - id: PLAN-A11Y-SECURITY-1-004
    severity: 2
    title: "The custom trigger has no checked contrast or target-size pairing"
    evidence:
      - artifact: "contracts/element.md:7 promises inherited tokens, usable targets and visible focus. The test ownership in contracts/verification.md covers focus destination and forced-colors controls without a native trigger size or contrast assertion."
      - code: ".specify/memory/constitution.md Principle III requires the token focus ring, primary-action --ocelle-target-min and automated text and non-text contrast. packages/elements/src/ocelle-button.ts:143–159 declares the minimum on its own native control, and :194–218 chooses different token pairs for sheet and chrome. gates/bin/contrast.ts checks token pairs from the registry, with no inspection of the new internal button’s rendered CSS."
    claim: |
      The new native icon or initials trigger has its own styling surface. Existing button guarantees do not apply automatically. A compact trigger could be undersized or use an unaudited foreground and background pair while the planned keyboard path and repository contrast gate pass.
    remedies:
      - "Specify the trigger’s minimum inline and block target tokens, focus token and chosen foreground, background and boundary pairs for the supported grounds. Reuse already checked pairs or register the required pairs. Add browser assertions on the actual native button’s target dimensions and visible focus, using both themes and real forced-colors styles."
