findings:
  - id: PLAN-FRESH-2-001
    severity: 2
    title: "Wrapping inside the scroller needs a viewport-bound slotted group"
    evidence:
      - artifact: "plan.md Design says to let the same supplementary choices wrap based on available inline space. spec.md FR-007 and SC-004 require each choice to be reachable without sideways scrolling in the recipe."
      - code: "packages/elements/src/ocelle-scroller.ts:59 puts the default slot inside .region-track. packages/elements/src/overflow-region.ts:211-225 sets the box to overflow-x:auto and sizes the track to max-content with min-inline-size:100%; the track has no exported part."
    claim: |
      A recipe author can set flex-wrap on the slotted choices and still get one long row because the choices are sized inside the intrinsic max-content track. A percentage bound against that track also fails to express the available viewport width. The revised requirement needs a concrete width constraint the host can apply with the existing public surface.
    remedies:
      - "Specify a host-owned slotted choice group whose wrap-mode maximum comes from an outer recipe query container or an equivalent available-width constraint outside the intrinsic scroller track. In narrow and enlarged-text tests assert that the internal scroller no longer overflows and that every choice is reachable."
