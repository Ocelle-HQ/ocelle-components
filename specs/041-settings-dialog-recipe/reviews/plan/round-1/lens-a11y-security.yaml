schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: a11y-security
findings:
  - id: PLAN-A11Y-SECURITY-1-001
    severity: 3
    title: "Keep the current section identifiable when its navigation is collapsed"
    evidence:
      - artifact: "plan.md Design puts child destinations inside the disclosure. contracts/interaction.md keeps the selected panel when the category collapses. spec.md FR-005 requires a selected destination indicator."
      - code: "packages/elements/src/ocelle-disclosure.ts:268 places the panel inside native details. packages/elements/src/ocelle-nav-item.ts:156-165 renders current state on the inner destination link."
    claim: |
      When a direct child section is current, closing its category hides the link and its
      current marker. Retaining the selected ID in state leaves users without the nav
      cue while the same detail remains open. A detail title alone can also be ambiguous
      when hosts repeat section names across categories.
    remedies:
      - "Specify a visible and accessible current category and section cue outside the collapsible links, such as a breadcrumb or heading context. Verify it after collapse in forced colors and the accessibility tree, without applying aria-current to an unrelated link."
  - id: PLAN-A11Y-SECURITY-1-002
    severity: 2
    title: "Give the supplemental scroller an explicit name and focus order"
    evidence:
      - artifact: "plan.md Design introduces a horizontal scroller for supplementary detail choices and requires the primary action to be the first control after the detail heading."
      - code: "packages/elements/src/ocelle-scroller.ts:14,44-45 documents that an overflowing strip is a tab stop and an unlabeled strip has no role. specs/009-workflow-layouts/reviews/spec/check-1.md SPEC-1-10 records the unnamed generic focus stop."
    claim: |
      The recipe can yield an unnamed focus stop when inline choices overflow at
      enlarged text or a narrow width. The scroller itself also becomes a focus stop
      independent of its slotted controls, so sequencing only the actionable controls
      does not guarantee the next Tab destination in FR-005.
    remedies:
      - "Require a meaningful scroller label, place the scroller after the first detail action in sequential focus order, and verify its name and arrow-key scroll when overflowing as well as the immediate next Tab from the detail heading."
  - id: PLAN-A11Y-SECURITY-1-003
    severity: 2
    title: "Specify how keyboard users scroll the desktop content pane"
    evidence:
      - artifact: "plan.md Design gives the inner content pane vertical overflow. quickstart.md steps 1 and 2 check scrolling and keyboard independently, without a keyboard scroll scenario."
      - code: "packages/elements/src/overlay.ts:366 and :795-801 add conditional tabindex to the dialog body itself, not a nested recipe pane. packages/elements/src/ocelle-scroller.ts:14 documents inline-axis scrolling only."
    claim: |
      A nested, separately scrolling panel needs a keyboard route to its overflow
      even when the host content is mostly static. The dialog body's tabindex only
      reacts to its own overflow. Relying on that stop or on the horizontal scroller
      does not provide a route to the independently scrolling desktop pane.
    remedies:
      - "Specify how keyboard users reach and scroll the independent vertical pane in supported engines while preserving the heading-to-first-action Tab order. Add a real-keyboard scenario that scrolls to the end of long text and keeps Close reachable."
