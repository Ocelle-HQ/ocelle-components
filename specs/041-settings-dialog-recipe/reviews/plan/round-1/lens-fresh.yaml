schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: fresh
findings:
  - id: PLAN-FRESH-1-001
    severity: 2
    title: "A collapsed category can hide the only current-destination indicator"
    evidence:
      - artifact: "spec.md FR-005 and Edge Cases require identifying the selected destination after its category collapses. plan.md Design places child destinations inside the disclosure and tracks the current destination independently."
      - code: "packages/elements/src/ocelle-nav-item.ts:152-165 renders aria-current on the inner anchor. packages/elements/src/ocelle-disclosure.ts:268 places its default slot inside the native details panel."
    claim: |
      Landing-panel section destinations disappear on switching to a detail, and collapsing the navigation group hides its child anchors. With the planned current marker attached to the child anchor, the user loses the marker even though the selected panel is unchanged. Keeping the destination in model state alone leaves that state out of the visible and accessible experience.
    remedies:
      - "Define a persistent context cue outside the collapsible child list for the current section, such as a labeled current location in the detail panel. Keep the category landing link's destination semantics and verify the cue before and after collapse, including a detail reached directly from a landing panel while the group is already collapsed."
  - id: PLAN-FRESH-1-002
    severity: 2
    title: "Long host-supplied navigation needs a wide-layout overflow owner"
    evidence:
      - artifact: "plan.md Design constrains the content pane and describes outer body scrolling only in the stacked layout. data-model.md defines host-supplied ordered sections and independently disclosed categories without a count limit."
      - code: "packages/elements/src/ocelle-disclosure.ts:126-129 styles only the child panel padding. packages/elements/src/overlay.ts:116-129 and :194-200 permit scrolling at the outer modal and body when their content overflows."
    claim: |
      Multiple expanded categories or wrapped labels can make the navigation taller than the fixed modal even when detail content is short. The current wide-layout plan bounds only the detail side, so the lower destinations could be clipped or could force the shell itself to scroll. The sample's short navigation would miss either outcome.
    remedies:
      - "Specify how the wide navigation column scrolls when it exceeds the available height, with the dialogue header and detail scroll position independent. Exercise an expanded long navigation at a shallow wide viewport or enlarged text and verify that keyboard focus exposes the last destination."
