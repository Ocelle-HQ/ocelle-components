schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: testability
findings:
  - id: PLAN-TESTABILITY-1-001
    severity: 3
    title: "Make the Phase 1 red prove the removed border"
    evidence:
      - artifact: "plan.md:26 asks the browser red to show the existing lower edge; spec.md:104-105 instead sets the final observable result to zero top-bar divider pixels and a visible consumer divider. quickstart.md:19 calls for scoped Mutation without distinguishing a deletion-only phase."
      - code: "packages/elements/src/ocelle-top-bar.ts:46,109-112 hold the styles the plan only deletes. gates/lib/mutation/ranges.ts:91-119 records only positive new-side hunk lengths. gates/bin/mutation.ts:183-195 rejects an explicit unsupported path or returns success with nothing selected."
    claim: |
      A fixture that confirms the old edge or only compares new images does not establish a red assertion for its
      removal. The planned deletion contributes no changed line to Stryker, so a successful empty Mutation result
      adds no evidence that the browser assertion detects the border.
    remedies:
      - "Require the same tests-only assertions to find zero top-bar divider pixels in both themes and forced colours, with a settled visible top bar and an independently visible fixture divider at the intended pane boundary. Retain the assertion failure on the pinned old top-bar source and the green result on the deletion. Run and record the normal Mutation gate, reporting a deletion-only empty scope as such."

  - id: PLAN-TESTABILITY-1-002
    severity: 3
    title: "Exercise the opted-in vertical divider in forced colours"
    evidence:
      - artifact: "plan.md:30-34 and quickstart.md:10 list the opt-in geometry checks but do not pair the opt-in with forced colours. spec.md:96-98 and triage/038-shell-chrome-alignment.md:61-62 require forced-colour verification of the changed separation."
      - code: "packages/elements/test/scenarios/personal-rail.ts:630-648 checks system-colour pixels for a default vertical rail and a horizontal rail only. Both mount without the new opt-in, and the vertical fixture does not set a fixed spare height. packages/elements/src/ocelle-personal-rail.ts:122-127 already groups ordinary palette rules behind a non-forced media query."
    claim: |
      An opt-in placement selector accidentally scoped to the ordinary palette can pass the normal-theme
      opt-in comparisons and the inherited forced-colours tests while producing the old divider position in high
      contrast. The current forced-colour scenario also cannot prove the system-colour divider is visible at the
      new position.
    remedies:
      - "Plan an explicitly opted-in, populated, fixed-height vertical case in forced colours, through the existing shared in-process and built tests. Assert actual system-colour divider pixels at one token gap above the bottom group, spare space before the divider, and preserved item positions against a default control."

  - id: PLAN-TESTABILITY-1-003
    severity: 2
    title: "Pin the narrow badge specimen and prove rendered focus visibility"
    evidence:
      - artifact: "plan.md:38-40 and quickstart.md:11 refer to the reference Settings fixture and an uncropped focus ring without specifying the independent rendered observation or the built fixture changes. spec.md:92-95 requires the long title, badge, menu, Settings action and unclipped indicators together at 320 px."
      - code: "packages/elements/test/top-bar.test.ts:76-94 checks :focus-visible and a solid computed outline, which cannot detect paint clipping. packages/elements/test/browser/app-shell.test.ts:17-22 asserts a 1280 px viewport, its fixture CSS sets the narrow frame to 26rem, and fixtures/app-shell.html:14-18 has no chrome Settings action. packages/elements/src/ocelle-app-shell.ts:355-363 emits the menu only for narrow shell with real navigation."
    claim: |
      Merely extending the named existing fixtures can leave the required menu, badge and Settings arrangement
      unexercised in the built example. A computed focus style stays solid even if the accessory layout clips
      its painted pixels.
    remedies:
      - "Assign an explicit 320 CSS px long-title/badge/Settings acceptance specimen with actual navigable shell content. Require the fixture to prove the menu and Settings are both present and reached by trusted Tab, and use rendered pixel sampling or an independently justified clipping-bound check for each focus ring. Specify which edited external built fixture exercises actual badge projection with the clean CSP result, keeping the existing built drawer scenario as a regression control."
