schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: correctness
findings:
  - id: PLAN-CORRECTNESS-1-001
    severity: 2
    title: "Include fallback vertical orientation in the opt-in contract"
    evidence:
      - artifact: "plan.md:32-34 and contracts/shell-chrome.md:9 say vertical placement and enumerate default vertical and horizontal checks, without defining the existing attribute fallback for the opted-in case."
      - code: "packages/elements/src/ocelle-personal-rail.ts:8-12,91-119,138-144 makes only orientation=horizontal horizontal. packages/elements/README.md:1010-1015 documents absent and other values as vertical. packages/elements/test/scenarios/personal-rail.ts:17-19 already protects empty and invalid values in the existing layout."
    claim: |
      The new opt-in applies to the effective vertical layout, including the usual markup with no orientation attribute. A rule keyed to the literal vertical attribute would pass a tall opt-in test that supplies orientation=vertical and leave those documented consumers with the old divider placement. The pre-existing empty and invalid orientation tests never turn the new flag on.
    remedies:
      - "State in the plan and rail contract that only orientation=horizontal disables the vertical opt-in. Use the default omitted attribute in the tall opt-in fixture and extend the fallback pair to confirm that empty and other values still act vertically without changing the attribute."
  - id: PLAN-CORRECTNESS-1-002
    severity: 2
    title: "Replace the equal-gap description in the published rail documentation"
    evidence:
      - artifact: "plan.md:32-45 and contracts/shell-chrome.md:9,17 define the spare-space redistribution and call for documenting the new attribute/property. Neither names the conflicting geometric promise in the consumer README."
      - code: "packages/elements/README.md:1003-1008 says the divider is one normal item gap from each group. packages/elements/src/ocelle-personal-rail.ts:14-25,65-88 put spare height between the divider and bottom group in the existing tall vertical layout."
    claim: |
      Adding a property bullet without replacing the existing spacing paragraph would publish two incompatible descriptions. With spare height, the default vertical divider sits one gap from the primary group, while the new opted-in divider sits one gap from the bottom group.
    remedies:
      - "Assign the Phase 2 README update specifically to replace the generic equal-gap statement with the tested default and opted-in vertical rules, retaining the current horizontal, divider thickness/colour and empty-group contract."
