schema: review-findings/v1
complete: true
phase: plan
round: 1
lens: a11y-security
findings:
  - id: PLAN-A11Y-SECURITY-1-001
    severity: 3
    title: "Verify the changed rail and accessory states in forced colours"
    evidence:
      - artifact: "spec.md FR-002, FR-007 and SC-004 require preserved controls and separate forced-colour proof. plan.md Phase 1 assigns forced colours to edge pixels, while Phase 2 and Phase 3 do not assign forced colours to the new populated rail and badge states. quickstart.md only specifies that media mode for Phase 1."
      - code: "packages/elements/test/scenarios/personal-rail.ts:630-648 mounts ordinary vertical and horizontal rails, with no opt-in flag. packages/elements/test/app-shell-reflow.test.ts:12-37 uses forced colours and reduced motion but mounts only rail and sidebar content. packages/elements/src/ocelle-top-bar.ts:93-121 has distinct normal and forced-colour focus styling."
    claim: |
      Existing forced-colour cases can pass without exercising the new vertical placement or the 320 px
      accessory with the Settings action. The two-theme Storybook captures cannot establish the forced-colour
      behavior. A media-guarded regression could leave an incorrect opted-in divider placement or an unreadable
      badge or obscured focused control while the assigned checks are green.
    remedies:
      - "Assign a populated, tall, opted-in vertical rail in the existing forced-colour helper, checking the system-colour divider pixels, bottom gap and unchanged destination order. Assign the 320 px badge, menu and real Settings action in the forced-colours reflow fixture, checking visible badge text and the complete visible focus indicator on each control after trusted keyboard navigation. Keep the light/dark captures and the independent built CSP case."
  - id: PLAN-A11Y-SECURITY-1-002
    severity: 3
    title: "Exercise accessory projection in the strict-CSP specimen itself"
    evidence:
      - artifact: "plan.md Phase 3 and quickstart.md Run the targeted checks first reference the existing built shell test and a clean CSP verdict without naming an accessory-bearing built case or making the projection and activation assertions part of that verdict. contracts/shell-chrome.md Public record asks for the same native interactions in the external fixture."
      - code: "packages/elements/test/browser/fixtures/app-shell.html:13-21 has a short Projects name, one sidebar link and a main action, with no brand-accessory or top-bar action. packages/elements/test/browser/app-shell.test.ts:17-41 exercises a narrow shell inside a 1280 px viewport, menu and skip/main focus, and collects clean runtime evidence. Its current path never renders the new slot."
    claim: |
      Running the existing built check and the new in-process test separately could be reported as CSP
      coverage without the new slot ever rendering in the policy-constrained document. The strict fixture
      must establish that composition and its host action actually operate under the policy.
    remedies:
      - "Name the built HTML, external CSS/module and browser test owners. Extend the named strict-CSP fixture or add a sibling case that projects a real badge and Settings action through the built shell, verifies one composed/accessible badge, exercises the real menu and Settings action with the keyboard, and asserts the existing clean runtime record after those interactions. Keep 320 px viewport geometry in the explicit reflow check."
