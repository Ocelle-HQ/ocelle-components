name: Anchored popover Phase 3 start
on:
  push:
    branches:
      - 'ci/036-phase-3-start'
permissions:
  contents: read
jobs:
  kickoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      SPECIFY_FEATURE: 036-anchored-popover-pilot
      SPECIFY_FEATURE_DIRECTORY: specs/036-anchored-popover
      SPECIFY_FEATURE_NO_PERSIST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1c57ea49e366c701ea7f1e72d8c44c4ce143b26d
          fetch-depth: 0
          persist-credentials: false
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1c57ea49e366c701ea7f1e72d8c44c4ce143b26d"
          test -z "$(git status --porcelain)"
          .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          .specify/extensions/story/scripts/verdict.sh 2 | jq -ce 'select(.verdict == "approved")'
          .specify/extensions/story/scripts/units.sh | jq -ce 'select(length == 1 and .[0].phase == 3 and .[0].open == 12)'
          .specify/extensions/story/scripts/base.sh 3
          test "$(cat specs/036-anchored-popover/reviews/phase-3/base.sha)" = "1c57ea49e366c701ea7f1e72d8c44c4ce143b26d"
          printf 'PHASE_THREE_BASE=%s\n' "$(cat specs/036-anchored-popover/reviews/phase-3/base.sha)"
