name: Shell 038 governance proof
on:
  push:
    branches: [ci/038-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/038-shell-chrome-alignment
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 89ff9b749d72707006cf0aaa9d86f26e97cc72ad
          fetch-depth: 0
          persist-credentials: false
      - name: Verify refute scope and read squad status
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "89ff9b749d72707006cf0aaa9d86f26e97cc72ad"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh refute d3f8f3feb58cf8471422abe7069b93415d0dcee1
          status=$(.specify/extensions/squad/scripts/status.sh)
          echo "$status"
          jq -e '.round == 1 and .lens_files == 4 and .confirmed == 7 and .fixes == 7 and .forks == 0 and .undecided == 0' <<< "$status"
