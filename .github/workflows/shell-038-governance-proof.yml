name: Shell 038 governance proof
on:
  push:
    branches: [ci/038-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/038-shell-chrome-alignment
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 72645a36ab2108380cc3614534d85b50c764814f
          fetch-depth: 0
          persist-credentials: false
      - name: Check fresh lens scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "72645a36ab2108380cc3614534d85b50c764814f"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh lens f4b24d7cd272bd38d26a5f32ce40e9c0146d6e96
          grep -Fx 'findings: []' specs/038-shell-chrome-alignment/reviews/plan/round-2/lens-fresh.yaml
