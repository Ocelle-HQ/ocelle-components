name: Shell 038 governance proof
on:
  push:
    branches: [ci/038-governance]
permissions:
  contents: read
jobs:
  lenses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/038-shell-chrome-alignment
      SPECIFY_FEATURE_NO_PERSIST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a7867ad8b479718814d5d71f3f0cc116b2701c36
          fetch-depth: 0
          persist-credentials: false
      - name: Validate complete plan lens scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a7867ad8b479718814d5d71f3f0cc116b2701c36"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh lens d3f8f3feb58cf8471422abe7069b93415d0dcee1
          grep -c '^complete: true$' specs/038-shell-chrome-alignment/reviews/plan/round-1/lens-*.yaml
