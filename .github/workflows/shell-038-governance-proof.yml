name: Shell 038 governance proof
on:
  push:
    branches: [ci/038-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/038-shell-chrome-alignment
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1451b45ba68a5780693d69935e8a87f9c7419fc6
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the first implementation phase
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "1451b45ba68a5780693d69935e8a87f9c7419fc6"
          test -z "$(git status --porcelain)"
          .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          result=$(.specify/extensions/story/scripts/base.sh 1)
          echo "$result"
          jq -e --arg sha '1451b45ba68a5780693d69935e8a87f9c7419fc6' '.phase == "1" and .base == $sha' <<< "$result"
          test "$(cat specs/038-shell-chrome-alignment/reviews/phase-1/base.sha)" = "1451b45ba68a5780693d69935e8a87f9c7419fc6"
