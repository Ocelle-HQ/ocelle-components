name: Shell 038 governance proof
on:
  push:
    branches: [ci/038-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/038-shell-chrome-alignment
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4d964d422a509869583a05d657879977a1641597
          fetch-depth: 0
          persist-credentials: false
      - name: Check task review, analysis and exact phase list
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "4d964d422a509869583a05d657879977a1641597"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh analyze 2fceb5dd95b699b31ba826b44ae2caf8df87a417
          tooling/speckit/bin/scope-check.sh planner d9df4474cca1d39dbfe7c4069b20655ba117d2b4
          result=$(.specify/extensions/squad/scripts/analysis-status.sh)
          echo "$result"
          jq -e '.present and .critical == 0 and .high == 0 and .coverage == "100"' <<< "$result"
          units=$(.specify/extensions/story/scripts/units.sh)
          echo "$units"
          jq -e 'map(.phase) == [1,2,3] and (map(.total)|add) == 15' <<< "$units"
