name: Shell 038 governance proof
on:
  push:
    branches: [ci/038-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/038-shell-chrome-alignment
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d3b6cec7a34388d3e891c27f6c6dee06e4708318
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the clean plan round and task setup paths
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d3b6cec7a34388d3e891c27f6c6dee06e4708318"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh refute f4b24d7cd272bd38d26a5f32ce40e9c0146d6e96
          status=$(.specify/extensions/squad/scripts/status.sh)
          echo "$status"
          jq -e '.round == 2 and .lens_files == 1 and .confirmed == 0 and .forks == 0 and .unresolved == 0' <<< "$status"
          task_setup=$(.specify/scripts/bash/setup-tasks.sh --json)
          jq '{FEATURE_DIR, TASKS_TEMPLATE, AVAILABLE_DOCS}' <<< "$task_setup"
          test -z "$(git status --porcelain)"
