name: Shell 038 governance proof
on:
  push:
    branches: [ci/038-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/038-shell-chrome-alignment
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d60640d51ac70e8c3190a071c19e180cb686fa17
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the planner fix scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d60640d51ac70e8c3190a071c19e180cb686fa17"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh planner 89ff9b749d72707006cf0aaa9d86f26e97cc72ad
