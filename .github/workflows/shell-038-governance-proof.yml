name: Shell 038 governance proof
on:
  push:
    branches: [ci/038-governance]
permissions:
  contents: read
jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/038-shell-chrome-alignment
      SPECIFY_FEATURE_NO_PERSIST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8f73c33c9487f69f4e65f2cb0419816ba22a5d64
          fetch-depth: 0
          persist-credentials: false
      - name: Open the first plan squad round
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "8f73c33c9487f69f4e65f2cb0419816ba22a5d64"
          test -z "$(git status --porcelain)"
          git config user.name "Ocelle Spec Kit proof"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=$(.specify/extensions/squad/scripts/round.sh)
          echo "$status"
          jq -e '.round == 1 and (.lenses | length) == 4' <<< "$status"
          test "$(cat specs/038-shell-chrome-alignment/reviews/plan/round-1/base.sha)" = "8f73c33c9487f69f4e65f2cb0419816ba22a5d64"
          test -z "$(git status --porcelain)"
