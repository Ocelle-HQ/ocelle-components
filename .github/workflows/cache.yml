# Cache warming (contracts/ci-checks.md, research.md R-16; operator decision, plan squad round 3): on every push to
# main, install as a CI job does and save the pnpm store (keyed on the hash of pnpm-lock.yaml) and the Playwright
# browser cache (keyed on the pinned Playwright version) under the keys .github/actions/setup computes and ci.yml
# restores. Pull requests can restore caches saved on their base branch, never ones another pull request saved. Not a
# gate: it reports no check the ruleset requires, and the registry check does not read it.
name: Cache

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  warm:
    name: Warm caches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          restore: "false"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: ${{ steps.setup.outputs.store-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.playwright-path }}
          key: ${{ steps.setup.outputs.playwright-key }}
