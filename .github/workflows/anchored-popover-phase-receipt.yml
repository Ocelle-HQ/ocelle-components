name: Anchored popover exact advisory receipt
on:
  push:
    branches: [ci/036-phase-1-receipt]
permissions:
  actions: read
jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ocelle-mutation-arms-1
          run-id: 46092128875
          repository: Ocelle-HQ/ocelle-components
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/advisory-receipt
      - name: Pin and export the two serial arms
        shell: bash
        run: |
          cd "$RUNNER_TEMP/advisory-receipt"
          grep -Fx 'head=b78736328e6cec05b4d84d3a8724fe1b9c17c5d0' identity.txt
          grep -Fx 'base=58a38e180433d2b1eb748ac321e1234acd761c4b' identity.txt
          grep -Fx 'tree=ce2c696922ac3b2dc759f890bc1712d541a40d75' identity.txt
          selection=$(jq -er '[.[].files | select(split(",") | all(startswith("packages/elements/src/")))] | first' plan.json)
          test "$(cat selector.txt)" = "$selection"
          for name in identity.txt selector.txt plan.json full.exit related.exit full.jsonl related.jsonl full.log related.log; do
            test -f "$name"
            sha256sum "$name"
            while IFS= read -r chunk; do
              printf 'record %s %s\n' "$name" "$chunk"
            done < <(base64 -w 3072 "$name")
          done
