name: Anchored popover Phase 2 Mutation and Plants
on:
  push:
    branches:
      - 'ci/036-phase-2-mutation-plants'
permissions:
  contents: read
jobs:
  affected-plant-selection:
    name: Affected Plants selection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ee04df4c61649ef876b0074c14d57b91a65490a
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Record the canonical exact-head Plant selection
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0ee04df4c61649ef876b0074c14d57b91a65490a"
          test "$(cat specs/036-anchored-popover/reviews/phase-2/base.sha)" = "a6ef9048f9ca30f69a32dd9b55e7d4085f154104"
          pnpm run gate:plants -- --affected a6ef9048f9ca30f69a32dd9b55e7d4085f154104 --list

  mutation-plan:
    name: Mutation plan
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0ee04df4c61649ef876b0074c14d57b91a65490a
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: plan
        env:
          BASE: a6ef9048f9ca30f69a32dd9b55e7d4085f154104
        run: |
          shards="$(pnpm --silent run gate:mutation -- --base "$BASE" --plan)"
          echo "$shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
  mutation-shard:
    name: Mutation shard
    needs: mutation-plan
    if: needs.mutation-plan.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ contains(matrix.shard.files, 'packages/elements/src/') && 75 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0ee04df4c61649ef876b0074c14d57b91a65490a
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Values reach the script through the environment, never pasted into it (a shard's file list comes from the pull request).
      - env:
          BASE: a6ef9048f9ca30f69a32dd9b55e7d4085f154104
          FILES: ${{ matrix.shard.files }}
        run: pnpm run gate:mutation -- --base "$BASE" --files "$FILES"
  mutation:
    name: Mutation testing
    needs: [mutation-plan, mutation-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0ee04df4c61649ef876b0074c14d57b91a65490a
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Passes only when the plan succeeded and the shards succeeded, or were skipped because the plan had none.
      - env:
          PLAN: ${{ needs.mutation-plan.result }}
          SHARDS: ${{ needs.mutation-shard.result }}
          PLANNED: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          echo "mutation-plan: $PLAN; mutation-shard: $SHARDS; shards: $PLANNED"
          test "$PLAN" = success
          test "$SHARDS" = success || { test "$SHARDS" = skipped && test "$PLANNED" = "[]"; }
  plants-plan:
    name: Plants plan
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0ee04df4c61649ef876b0074c14d57b91a65490a
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        run: |
          shards="$(pnpm --silent run gate:plants -- --plan)"
          echo "$shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
  plants-shard:
    name: Plants shard
    needs: plants-plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plants-plan.outputs.shards) }}
    steps:
      - run: df -h /
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0ee04df4c61649ef876b0074c14d57b91a65490a
          persist-credentials: false
      - uses: ./.github/actions/setup
      - env:
          OCELLE_VISUAL_ENGINE: both
          SHARD: ${{ matrix.shard }}
        run: pnpm run gate:plants -- --shard "$SHARD"
      - if: always()
        run: df -h /
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plant-shard-${{ matrix.shard }}
          path: storybook/.visual/plant-shards/
          include-hidden-files: true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plants-${{ matrix.shard }}
          path: storybook/.visual/plants/
          include-hidden-files: true
  plants:
    name: Plants
    needs: [plants-plan, plants-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0ee04df4c61649ef876b0074c14d57b91a65490a
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plant-shard-*
          path: storybook/.visual/plant-shards/
          merge-multiple: true
      - run: pnpm run gate:plants -- --verdict storybook/.visual/plant-shards
