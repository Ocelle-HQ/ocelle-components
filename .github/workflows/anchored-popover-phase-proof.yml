name: Anchored popover phase proof

on:
  push:
    branches: [036-anchored-popover-proof]

permissions:
  contents: read

env:
  OCELLE_PROOF_HEAD: f871d4a1b6c1eaeab4ff706e5a2ae4faad5fc1ff
  OCELLE_PROOF_BASE: 58a38e180433d2b1eb748ac321e1234acd761c4b
  OCELLE_PROOF_PHASE: '1'

jobs:
  mutation-focus-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OCELLE_PROOF_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the restored product and native coverage tests
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ocelle-mutation-focus-tests"
          mkdir "$receipt"
          test "$(git rev-parse HEAD)" = "$OCELLE_PROOF_HEAD"
          printf 'head=%s\ntree=%s\nrun=%s\nattempt=%s\nrunner=%s\n' "$OCELLE_PROOF_HEAD" \
            "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ImageVersion" \
            | tee "$receipt/identity.txt"
          pnpm exec vitest run --project elements --maxWorkers=1 \
            --reporter=default --reporter=json --outputFile.json="$receipt/vitest.json" \
            packages/elements/test/anchored-popover.test.ts \
            packages/elements/test/anchored-popover-lifecycle.test.ts \
            packages/elements/test/entry-anchored-popover.test.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ocelle-mutation-focus-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocelle-mutation-focus-tests
          if-no-files-found: error
