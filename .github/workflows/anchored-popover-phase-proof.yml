name: Anchored popover phase proof

on:
  push:
    branches: [036-anchored-popover-proof]

permissions:
  contents: read

env:
  OCELLE_PROOF_HEAD: b78736328e6cec05b4d84d3a8724fe1b9c17c5d0
  OCELLE_PROOF_BASE: 58a38e180433d2b1eb748ac321e1234acd761c4b
  OCELLE_PROOF_PHASE: '1'

jobs:
  phase-controls:
    name: Compare the phase and tested PR gate plans
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OCELLE_PROOF_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Record affected Plants and compare exact Mutation ranges
        env:
          OCELLE_PR_BASE: e7658048a82d24714f8e395d814a396d2db9e0d2
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ocelle-phase-controls"
          mkdir "$receipt"
          test "$(git rev-parse HEAD)" = "$OCELLE_PROOF_HEAD"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$OCELLE_PR_BASE" HEAD
          git merge-base --is-ancestor "$OCELLE_PROOF_BASE" HEAD
          printf 'head=%s\nphase_base=%s\npr_base=%s\ntree=%s\nrun=%s\nattempt=%s\nnode=%s\n' \
            "$OCELLE_PROOF_HEAD" "$OCELLE_PROOF_BASE" "$OCELLE_PR_BASE" "$(git rev-parse 'HEAD^{tree}')" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(node --version)" | tee "$receipt/identity.txt"
          node gates/bin/plants.ts --affected "$OCELLE_PROOF_BASE" --list > "$receipt/plants-list.txt" 2>&1
          grep -F 'note: affected: every plant, by packages/elements/package.json' "$receipt/plants-list.txt"
          node gates/bin/mutation.ts --base "$OCELLE_PROOF_BASE" --plan > "$receipt/phase-mutation-plan.json"
          node gates/bin/mutation.ts --base "$OCELLE_PR_BASE" --plan > "$receipt/pr-mutation-plan.json"
          cmp "$receipt/phase-mutation-plan.json" "$receipt/pr-mutation-plan.json"
          jq -e 'length == 12' "$receipt/phase-mutation-plan.json"
          sha256sum "$receipt/phase-mutation-plan.json" "$receipt/pr-mutation-plan.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ocelle-phase-controls-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocelle-phase-controls
          if-no-files-found: error

