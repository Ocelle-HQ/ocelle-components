name: Anchored popover phase proof

on:
  push:
    branches: [036-anchored-popover-proof]

permissions:
  contents: read

env:
  OCELLE_PROOF_HEAD: 8bfe6191ee1adc32771d592132d4c37bd3d06a0f
  OCELLE_PROOF_BASE: 58a38e180433d2b1eb748ac321e1234acd761c4b
  OCELLE_PROOF_PHASE: '1'

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OCELLE_PROOF_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run and record the canonical phase red
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/036-anchored-popover
          SPECIFY_FEATURE_NO_PERSIST: '1'
          OCELLE_RED_LABEL: 'fix-3'
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ocelle-red-proof"
          mkdir "$receipt"
          folder="specs/036-anchored-popover/reviews/phase-$OCELLE_PROOF_PHASE"
          test "$(git rev-parse HEAD)" = "$OCELLE_PROOF_HEAD"
          test "$(cat "$folder/base.sha")" = "$OCELLE_PROOF_BASE"
          git merge-base --is-ancestor "$OCELLE_PROOF_BASE" HEAD
          printf 'head=%s\nbase=%s\ntree=%s\nrun=%s\nattempt=%s\nrunner=%s\n' \
            "$OCELLE_PROOF_HEAD" "$OCELLE_PROOF_BASE" "$(git rev-parse 'HEAD^{tree}')" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ImageVersion" | tee "$receipt/identity.txt"
          .specify/extensions/story/scripts/red.sh "$OCELLE_PROOF_PHASE" "$OCELLE_RED_LABEL" | tee "$receipt/red.json"
          cp "$folder/red-$OCELLE_RED_LABEL.log" "$receipt/"
          test -f "$folder/red-commits" && cp "$folder/red-commits" "$receipt/"
          jq -e --arg head "$OCELLE_PROOF_HEAD" \
            '.sha == $head and .tests_only and .red and .recorded and .exit_code == 1' "$receipt/red.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ocelle-phase-red-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocelle-red-proof
          if-no-files-found: error

