name: Diagnose anchored popover Phase 2 generated manifest and regressions
on:
  push:
    branches:
      - 'ci/036-phase-2-diagnostics'
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db86303363ea1bed8d9ef40dfa6a63c844e4eee6
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compare exact generated manifest to this source pin
        run: |
          set -euo pipefail
          pnpm --filter @ocelle/elements run manifest
          git diff -- packages/elements/custom-elements.json
