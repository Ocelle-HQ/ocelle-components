name: Diagnose anchored popover Phase 2 generated manifest and regressions
on:
  push:
    branches:
      - 'ci/036-phase-2-diagnostics'
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ee04df4c61649ef876b0074c14d57b91a65490a
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compare exact generated manifest to this source pin
        run: |
          set -euo pipefail
          pnpm --filter @ocelle/elements run manifest
          git diff -- packages/elements/custom-elements.json
  focused-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ee04df4c61649ef876b0074c14d57b91a65490a
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run only the three popover interaction projects
        run: |
          set -euo pipefail
          node gates/bin/test.ts --project elements --project elements-touch --project elements-browser \
            packages/elements/test/anchored-popover.test.ts \
            packages/elements/test/anchored-popover-lifecycle.test.ts \
            packages/elements/test/anchored-popover-pointer.test.ts \
            packages/elements/test/anchored-popover.touch.test.ts \
            packages/elements/test/anchored-popover-placement.test.ts \
            packages/elements/test/browser/anchored-popover.test.ts
