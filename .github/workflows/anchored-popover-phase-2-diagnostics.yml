name: Verify adopted popover rule cleanup equivalence
on:
  push:
    branches:
      - 'ci/036-phase-2-diagnostics'
permissions:
  contents: read
jobs:
  native-cssom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f4fc2e8bbf2ab1c30b2513fbb0078bfe81440a5f
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check CSS parser behavior in native Chromium
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            const result = await page.evaluate(() => {
              const root = document.createElement("div").attachShadow({ mode: "open" });
              const sheet = new CSSStyleSheet();
              sheet.replaceSync('[part="surface"] {}');
              root.adoptedStyleSheets = [sheet];
              const style = sheet.cssRules.item(0).style;
              return ["", "Stryker was here!"].map((value) => {
                style.setProperty("max-width", "183px");
                style.setProperty("max-height", "102px");
                style.setProperty("left", "23px");
                style.setProperty("top", "19px");
                const before = style.length;
                style.cssText = value;
                return { before, after: style.length, text: style.cssText, left: style.left, top: style.top };
              });
            });
            console.log(JSON.stringify(result));
            assert.deepEqual(result, Array.from({ length: 2 }, () => ({ before: 4, after: 0, text: "", left: "", top: "" })));
          } finally {
            await browser.close();
          }
          JS
