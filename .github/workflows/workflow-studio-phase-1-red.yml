name: Workflow Studio Phase 1 red
on:
  push:
    branches:
      - 'ci/039-phase-1-red'
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 573aba55f8ae3c8e147f73bfc696c99861a6c136
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Record tests-only red and prove the base and scaffold overlays
        shell: bash
        run: |
          set -euo pipefail
          export OCELLE_CHROMIUM_PATH="$(pnpm exec playwright install --dry-run chromium | sed -n 's/.*Install location: *//p' | head -1)/chrome-linux64/chrome"
          if [[ ! -x "$OCELLE_CHROMIUM_PATH" ]]; then unset OCELLE_CHROMIUM_PATH; fi
          dir=specs/039-workflow-studio-compositions/reviews/phase-1
          test "$(git rev-parse HEAD)" = "573aba55f8ae3c8e147f73bfc696c99861a6c136"
          git diff-tree --no-commit-id --name-only -r HEAD
          .specify/extensions/story/scripts/red.sh 1 phase | tee /tmp/ocelle-studio-red.json
          test "$(cat "$dir/red-commits")" = "phase 573aba55f8ae3c8e147f73bfc696c99861a6c136"
          .specify/extensions/story/scripts/tdd-check.sh 1
          node --input-type=commonjs -e 'const d=require(process.argv[1]); console.log(JSON.stringify(d,null,2)); if(d.status!=="fail" || ![1,3].includes(d.final_tests_on_base_exit) || d.final_tests_on_scaffold_exit!==1 || d.head_exit!==1 || d.problems.length!==1) process.exit(1)' "./$dir/tdd-check.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: workflow-studio-phase-1-red-proof
          path: specs/039-workflow-studio-compositions/reviews/phase-1/
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 573aba55f8ae3c8e147f73bfc696c99861a6c136
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run gate:typecheck
      - if: success() || failure()
        run: pnpm run gate:lint
      - if: success() || failure()
        run: pnpm run gate:test-lint
