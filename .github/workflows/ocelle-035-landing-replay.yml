name: Copy-field landing replay
on:
  push:
    branches: [ci/035-landing-replay]
permissions:
  contents: read
jobs:
  original:
    name: Reproduce the original phase ${{ matrix.phase }} proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: '1'
            revision: 64f78a85d1be5f4d5e3d1c733b0994cd538a4dc9
            phase_base: e340eefa9128bc1e5ede06cc06fb46a252d7a702
            labels: '["phase","fix-1"]'
            assertion_counts: '[51,1]'
          - phase: '2'
            revision: f44dbfd4aa3bb2f36a45dcde13a889215a7742e9
            phase_base: d8793108e6786c58d2d04ca140ee60c1c41b3849
            labels: '["phase"]'
            assertion_counts: '[3]'
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/035-copy-identifier-groups
      SPECIFY_FEATURE_NO_PERSIST: "1"
      PHASE: ${{ matrix.phase }}
      EXPECTED_REVISION: ${{ matrix.revision }}
      PHASE_BASE: ${{ matrix.phase_base }}
      LABELS: ${{ matrix.labels }}
      COUNTS: ${{ matrix.assertion_counts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the historical canonical replay unchanged
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain)"
          test ! -e "$SPECIFY_FEATURE_DIRECTORY/reviews/phase-$PHASE/replay-upstream.sha"
          test "$(cat "$SPECIFY_FEATURE_DIRECTORY/reviews/phase-$PHASE/base.sha")" = "$PHASE_BASE"
          report="$RUNNER_TEMP/original-replay.json"
          .specify/extensions/story/scripts/tdd-check.sh "$PHASE" > "$report"
          jq '{status, head, base, final_tests_on_base_exit, head_exit, problems, reds: [.red_commits[] | {label, exit_code, count: (.evidence.assertions | length)}]}' "$report"
          jq -e --arg sha "$EXPECTED_REVISION" --arg base "$PHASE_BASE" --argjson labels "$LABELS" --argjson counts "$COUNTS" '.status == "pass" and .head == $sha and .base == $base and .final_tests_on_base_exit == 1 and .head_exit == 0 and (.problems | length) == 0 and ([.red_commits[].label] == $labels) and ([.red_commits[].evidence.assertions | length] == $counts) and all(.red_commits[]; .exit_code == 1)' "$report"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-phase-${{ matrix.phase }}-replay
          path: ${{ runner.temp }}/original-replay.json
          if-no-files-found: error
  integration:
    name: Focused tests on the exact current-main integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5984afeb68540619a379e262fe7da18aeda04097
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify exact candidate and run focused tests
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "5984afeb68540619a379e262fe7da18aeda04097"
          test "$(git rev-parse 'HEAD^{tree}')" = "5c326907fe4615e384c8fb6cf4dc0bb7dd526c8f"
          test "$(git show -s --format=%P HEAD)" = "6fdbe28fba6adc8dd25f38d6a97fd850da1c000f 34c2fe11f9a68d1fde43b3f9d5dff13a29782bd5"
          test "$(git merge-base --all HEAD refs/remotes/origin/main)" = "34c2fe11f9a68d1fde43b3f9d5dff13a29782bd5"
          test -z "$(git status --porcelain)"
          pnpm exec vitest run \
            packages/elements/test/node/manifest.test.ts \
            packages/elements/test/browser/copy-field.test.ts \
            packages/elements/test/copy-field.test.ts \
            gates/test/vitest-config.test.ts \
            storybook/test/integration/copy-field-stories.test.ts \
            gates/test/integration/plant-repo.test.ts \
            gates/test/integration/storybook-build.test.ts
