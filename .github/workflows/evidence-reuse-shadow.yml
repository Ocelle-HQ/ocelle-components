name: Visual evidence reuse shadow

on:
  pull_request:
    types: [edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  observe:
    name: Observe Visual evidence reuse
    if: >-
      github.repository == 'Ocelle-HQ/ocelle-components' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.changes.body != null &&
      contains(github.event.pull_request.body, '<!-- verify-evidence-reuse:')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node gates/bin/evidence-reuse-shadow.ts "$RUNNER_TEMP/evidence-reuse-shadow.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-evidence-reuse-shadow
          path: ${{ runner.temp }}/evidence-reuse-shadow.json
          if-no-files-found: error
