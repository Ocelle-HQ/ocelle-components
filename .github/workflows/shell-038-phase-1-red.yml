name: Shell Phase 1 red evidence export
on:
  push:
    branches: [ci/038-phase-1-red]
permissions:
  actions: read
jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shell-phase-1-red
          run-id: 46090329640
          repository: Ocelle-HQ/ocelle-components
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/verified-shell-red
      - name: Confirm and export the canonical red receipt
        shell: bash
        run: |
          cd "$RUNNER_TEMP/verified-shell-red"
          jq -e --arg sha "66bcdcac20e1b3bce9e6a233f25bb1080b254616" '.sha == $sha and .recorded and .tests_only and .red and .exit_code == 1 and (.evidence.assertions | length) == 6' red.json >/dev/null
          test "$(cat red-commits)" = "phase 66bcdcac20e1b3bce9e6a233f25bb1080b254616"
          sha256sum red.json red-commits red-phase.log
          for file in red-commits red-phase.log; do
            printf 'evidence %s ' "$file"
            base64 -w 0 "$file"
            printf '\n'
          done
