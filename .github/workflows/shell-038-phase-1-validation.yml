name: Shell Phase 1 exact affected Plants
on:
  push:
    branches: [ci/038-phase-1-validation]
permissions:
  contents: read
jobs:
  affected:
    name: Run every Plant selected by the exact Phase 1 delta
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      OCELLE_VISUAL_ENGINE: both
      PHASE_BASE: 1451b45ba68a5780693d69935e8a87f9c7419fc6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: be87feddf8b96ba15319340ca7dce144cb9d6ad6
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the normal affected Plants gate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "be87feddf8b96ba15319340ca7dce144cb9d6ad6"
          git cat-file -e "$PHASE_BASE^{commit}"
          mkdir -p "$RUNNER_TEMP/shell-phase-1-plants"
          pnpm run gate:plants -- --affected "$PHASE_BASE" 2>&1 | tee "$RUNNER_TEMP/shell-phase-1-plants/plants.txt"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shell-phase-1-affected-plants
          path: ${{ runner.temp }}/shell-phase-1-plants/
          if-no-files-found: error
