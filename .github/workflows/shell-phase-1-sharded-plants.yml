name: Shell Phase 1 Plants
on:
  push:
    branches:
      - 'ci/038-phase-1-sharded-plants'
permissions:
  contents: read
jobs:
  plants-plan:
    name: Plants plan
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: be87feddf8b96ba15319340ca7dce144cb9d6ad6
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: plan
        run: |
          shards="$(pnpm --silent run gate:plants -- --plan)"
          echo "$shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
  plants-shard:
    name: Plants shard
    needs: plants-plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plants-plan.outputs.shards) }}
    steps:
      - run: df -h /
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: be87feddf8b96ba15319340ca7dce144cb9d6ad6
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - env:
          OCELLE_VISUAL_ENGINE: both
          SHARD: ${{ matrix.shard }}
        run: pnpm run gate:plants -- --shard "$SHARD"
      - if: always()
        run: df -h /
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plant-shard-${{ matrix.shard }}
          path: storybook/.visual/plant-shards/
          include-hidden-files: true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plants-${{ matrix.shard }}
          path: storybook/.visual/plants/
          include-hidden-files: true
  plants:
    name: Plants
    needs: [plants-plan, plants-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: be87feddf8b96ba15319340ca7dce144cb9d6ad6
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plant-shard-*
          path: storybook/.visual/plant-shards/
          merge-multiple: true
      - run: pnpm run gate:plants -- --verdict storybook/.visual/plant-shards
