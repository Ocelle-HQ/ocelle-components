name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0ba66195a854fccd47bb5715f9c664bef08fcee3
          fetch-depth: 0
          persist-credentials: false
      - name: Check the fresh lens scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0ba66195a854fccd47bb5715f9c664bef08fcee3"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh lens 30923bb52e0e4a5e99189c1697428ea9422a5c8e
          grep -Fx 'complete: true' specs/039-workflow-studio-compositions/reviews/plan/round-2/lens-fresh.yaml
