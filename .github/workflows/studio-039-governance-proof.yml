name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8dee940e0b4239bc11f91c769b5617cb0ea41863
          fetch-depth: 0
          persist-credentials: false
      - name: Open the first adversarial plan round
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "8dee940e0b4239bc11f91c769b5617cb0ea41863"
          test -z "$(git status --porcelain)"
          git config user.name "Ocelle Spec Kit proof"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=$(.specify/extensions/squad/scripts/round.sh)
          echo "$status"
          jq -e '.round == 1 and .lenses == ["correctness","a11y-security","testability","fresh"]' <<< "$status"
          test "$(cat "$SPECIFY_FEATURE_DIRECTORY/reviews/plan/round-1/base.sha")" = "8dee940e0b4239bc11f91c769b5617cb0ea41863"
