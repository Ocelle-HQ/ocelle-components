name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cb60f78ca275a355f44269e201e653886c54e07f
          fetch-depth: 0
          persist-credentials: false
      - name: Validate all four lens paths
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "cb60f78ca275a355f44269e201e653886c54e07f"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh lens 6f1e735d7898a8a059353c7c27de49ab3058ef2b
          grep -Fx 'complete: true' specs/039-workflow-studio-compositions/reviews/plan/round-1/lens-*.yaml | test "$(wc -l)" -eq 4
