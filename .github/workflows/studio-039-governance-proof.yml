name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 048a381f19d36ec913b9b8874ebd4d65011bb11f
          fetch-depth: 0
          persist-credentials: false
      - name: Check the second-round scope and single verified finding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "048a381f19d36ec913b9b8874ebd4d65011bb11f"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh refute 30923bb52e0e4a5e99189c1697428ea9422a5c8e
          status=$(.specify/extensions/squad/scripts/status.sh)
          echo "$status"
          jq -e '.round == 2 and .lens_files == 1 and .confirmed == 1 and .fixes == 1 and .forks == 0' <<< "$status"
