name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8e7ad6b3f397fe807c4c704de075b18229a397d3
          fetch-depth: 0
          persist-credentials: false
      - name: Check the scoped replay plan correction
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "8e7ad6b3f397fe807c4c704de075b18229a397d3"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh planner 048a381f19d36ec913b9b8874ebd4d65011bb11f
