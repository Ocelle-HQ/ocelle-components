name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a5310722ef8eec752dd366e14e0c84d7be1f0a09
          fetch-depth: 0
          persist-credentials: false
      - name: Verify independent analysis, task fixes and ordered phases
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a5310722ef8eec752dd366e14e0c84d7be1f0a09"
          test -z "$(git status --porcelain)"
          analysis="$RUNNER_TEMP/studio-analysis-scope"
          git worktree add --detach "$analysis" 1f727d1b998372194b1de312d40609515a6dc869
          trap 'git worktree remove --force "$analysis"' EXIT
          ( cd "$analysis" && tooling/speckit/bin/scope-check.sh analyze 4ef309d00bfce2d9deb308f4d8fb2015fa6a2b42 )
          tooling/speckit/bin/scope-check.sh planner 1f727d1b998372194b1de312d40609515a6dc869
          status=$(.specify/extensions/squad/scripts/analysis-status.sh)
          echo "$status"
          jq -e '.present and .critical == 0 and .high == 0 and .coverage == 100' <<< "$status"
          units=$(.specify/extensions/story/scripts/units.sh)
          echo "$units"
          jq -e 'map(.phase) == [1,2,3] and (map(.total)|add) == 24' <<< "$units"
