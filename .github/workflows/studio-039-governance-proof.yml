name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e6944774cab6c6032f6b1fc571f3c79d373108db
          fetch-depth: 0
          persist-credentials: false
      - name: Verify first spec check scope and findings
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "e6944774cab6c6032f6b1fc571f3c79d373108db"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh spec-check 977d4d508981f38f5da62d95d74bc5aec3ce0421
          status=$(.specify/extensions/squad/scripts/spec-status.sh)
          echo "$status"
          jq -e '.check == 1 and .verdict == "issues" and .blocking == 4 and .operator_questions == 0' <<< "$status"
