name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0255f6e1c73c7ca25b649a30af8700e2760b38a9
          fetch-depth: 0
          persist-credentials: false
      - name: Check the complete planner fix scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0255f6e1c73c7ca25b649a30af8700e2760b38a9"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh planner f209b1288700d7022db5d696e9c2e7b13d8f508f
