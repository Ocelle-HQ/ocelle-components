name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 067375dbe9b9428e235bdfac063f020fc7185c45
          fetch-depth: 0
          persist-credentials: false
      - name: Check the final independent lens scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "067375dbe9b9428e235bdfac063f020fc7185c45"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh lens 6234e03d102558b5b7658932d925af921d708b22
          grep -Fx 'findings: []' specs/039-workflow-studio-compositions/reviews/plan/round-3/lens-fresh.yaml
