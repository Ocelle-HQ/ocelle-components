name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d97b5042841fb131403b42958901a037e99f32d7
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the planner scope for eight fixes
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d97b5042841fb131403b42958901a037e99f32d7"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh planner f209b1288700d7022db5d696e9c2e7b13d8f508f
