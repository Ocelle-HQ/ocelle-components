name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c2c485e4de87e1a3d615b33999bc77b4b5d53bd4
          fetch-depth: 0
          persist-credentials: false
      - name: Verify prerequisites and pin the authoring phase
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "c2c485e4de87e1a3d615b33999bc77b4b5d53bd4"
          test -z "$(git status --porcelain)"
          .specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks
          result=$(.specify/extensions/story/scripts/base.sh 1)
          echo "$result"
          jq -e --arg sha 'c2c485e4de87e1a3d615b33999bc77b4b5d53bd4' '.phase == "1" and .base == $sha' <<< "$result"
          test "$(cat "$SPECIFY_FEATURE_DIRECTORY/reviews/phase-1/base.sha")" = "c2c485e4de87e1a3d615b33999bc77b4b5d53bd4"
