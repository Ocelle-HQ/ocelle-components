name: Workflow Studio governance proof
on:
  push:
    branches: [ci/039-governance]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPECIFY_FEATURE_DIRECTORY: specs/039-workflow-studio-compositions
      SPECIFY_FEATURE_NO_PERSIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 051adc6af8c0ba774a1317eb51c34fb9efca8cd7
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the first spec-fix scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "051adc6af8c0ba774a1317eb51c34fb9efca8cd7"
          test -z "$(git status --porcelain)"
          tooling/speckit/bin/scope-check.sh planner e6944774cab6c6032f6b1fc571f3c79d373108db
