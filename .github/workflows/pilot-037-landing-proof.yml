name: Op 037 landing replay
on:
  push:
    branches: [ci/037-landing-replay]
permissions:
  contents: read
jobs:
  replay:
    name: Verify the integrated Op 037 landing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7016e7dbedb8bb3a39b75e01ba65aacd03ecf8c3
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: |
          set -euo pipefail
          export SPECIFY_FEATURE_DIRECTORY=ops/037-pilot-feedback SPECIFY_FEATURE_NO_PERSIST=1
          test "$(git rev-parse HEAD)" = "7016e7dbedb8bb3a39b75e01ba65aacd03ecf8c3"
          test "$(git rev-parse refs/remotes/origin/main)" = "d45efd57402395999fcd7ab8fc29fba2c14a4e88"
          .specify/extensions/story/scripts/base.sh 1 --with-main d45efd57402395999fcd7ab8fc29fba2c14a4e88
          .specify/extensions/story/scripts/tdd-check.sh 1 | tee "$RUNNER_TEMP/ocelle-tdd.json"
          jq -e --arg sha "7016e7dbedb8bb3a39b75e01ba65aacd03ecf8c3" '.head == $sha and .status == "pass" and .head_exit == 0' "$RUNNER_TEMP/ocelle-tdd.json"
          pnpm exec vitest run --project gates gates/test/mutation-split.test.ts gates/test/mutation-ranges.test.ts
          printf '%s\n' OCELLE_TDD_LOG_START
          cat ops/037-pilot-feedback/reviews/phase-1/tdd-check.json
          printf '%s\n' OCELLE_TDD_LOG_FINISH
